<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>댓글로 만들어가는 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1b1f24;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    display: block;
    image-rendering: crisp-edges;
    image-rendering: pixelated;   /* 픽셀아트가 흐려지지 않게 */
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 세계 =====
  const TILE = 48;                                     // 거리 단위 1칸 = 타일 1개 (16px 그림 × 3)
  const TILES = 63;                                    // 세계는 63 × 63칸
  const WORLD = { w: TILE * TILES, h: TILE * TILES };
  // ===== 픽셀아트 — 일반 적·캐릭터 16×16, 중간보스 32×32, 최종보스 48×48 / 정수 배율 ×3 =====
  // 1px 어두운 외곽선 · 32색 팔레트 · 빛은 왼쪽 위. 그림은 글자 격자로 적고 처음 한 번만 캔버스로 굽는다.
  const PX = 3;
  const PAL = {
    k: '#1a1424', K: '#3a3048', w: '#f6f2ea', l: '#c3c3cc', g: '#8a8a98', G: '#55556a',
    e: '#9be070', n: '#4caf50', N: '#2b6b39', b: '#86ccff', u: '#3a8ee6', U: '#1f4c95',
    p: '#d0a4ff', v: '#9b59d6', V: '#5a2c8c', o: '#ffc46b', O: '#ff8c1a', q: '#a8530c',
    r: '#ff7a6e', R: '#e0302a', D: '#861418', s: '#f5c896', S: '#c8875c', c: '#d09a5c',
    B: '#8a5a30', d: '#553218', y: '#ffe14a', Y: '#f3e2c0', t: '#5ad0b4', i: '#ff9ec8',
    f: '#24442c', h: '#3c4a5c'
  };   // 32색
  // 테두리 음영: [밝은 쪽(왼쪽 위), 어두운 쪽(오른쪽 아래)]
  const SHADE = {
    l: ['w', 'g'], g: ['l', 'G'], G: ['g', 'K'], e: [null, 'n'], n: ['e', 'N'], N: ['n', 'f'],
    b: ['w', 'u'], u: ['b', 'U'], U: ['u', 'K'], p: ['w', 'v'], v: ['p', 'V'], V: ['v', 'K'],
    o: ['y', 'O'], O: ['o', 'q'], q: ['O', 'd'], r: ['i', 'R'], R: ['r', 'D'], D: ['R', 'K'],
    s: ['Y', 'S'], S: ['s', 'B'], c: ['Y', 'B'], B: ['c', 'd'], d: ['B', 'K'], Y: ['w', 'c'],
    h: ['g', 'K'], t: ['b', 'N'], f: ['N', 'k'], y: ['w', 'o'], i: ['w', 'r']
  };
  // 등급 색 (밝음 · 보통 · 어두움) — 장비 그림의 X·x·Z 자리에 들어감
  const GRADE_RAMP = [['l', 'g', 'G'], ['e', 'n', 'N'], ['b', 'u', 'U'], ['p', 'v', 'V'], ['o', 'O', 'q'], ['r', 'R', 'D']];
  const gradeMap = gi => ({ x: GRADE_RAMP[gi][0], X: GRADE_RAMP[gi][1], Z: GRADE_RAMP[gi][2] });

  function pgrid(rows) {
    const w = rows[0].length;
    for (const r of rows) if (r.length !== w) throw new Error('pixel row length ' + r.length + ' != ' + w + ': ' + r);
    return rows.map(r => r.split(''));
  }
  const gW = g => g[0].length, gH = g => g.length;
  const gclone = g => g.map(r => r.slice());
  const gblank = (w, h) => Array.from({ length: h }, () => Array(w).fill('.'));
  const isOn = (g, x, y) => y >= 0 && y < g.length && x >= 0 && x < g[0].length && g[y][x] !== '.';
  const recolor = (g, map) => g.map(r => r.map(c => map[c] || c));
  function overlayG(base, top) {
    const g = gclone(base);
    top.forEach((r, y) => r.forEach((c, x) => { if (c !== '.') g[y][x] = c; }));
    return g;
  }
  // 도형 (보스·아이콘을 그릴 때)
  function gPix(g, x, y, c) { x = Math.round(x); y = Math.round(y); if (y >= 0 && y < g.length && x >= 0 && x < g[0].length) g[y][x] = c; }
  function gRect(g, x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) gPix(g, x, y, c); }
  function gEllipse(g, cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
        if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) gPix(g, x, y, c);
  }
  function gRing(g, cx, cy, r0, r1, c) {
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d >= r0 && d <= r1) g[y][x] = c;
    }
  }
  function gLine(g, x0, y0, x1, y1, c, th) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
      if (th && th > 1) gRect(g, Math.round(x), Math.round(y), Math.round(x) + th - 1, Math.round(y), c);
      else gPix(g, x, y, c);
    }
  }
  // 빛은 왼쪽 위: 위·왼쪽이 비면 밝게, 아래·오른쪽이 비면 어둡게
  function shadeG(g) {
    const out = gclone(g);
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) {
      const c = g[y][x], sh = SHADE[c];
      if (c === '.' || !sh) continue;
      const lit = !isOn(g, x, y - 1) || !isOn(g, x - 1, y);
      const dark = !isOn(g, x, y + 1) || !isOn(g, x + 1, y);
      if (lit && !dark && sh[0]) out[y][x] = sh[0];
      else if (dark && !lit && sh[1]) out[y][x] = sh[1];
    }
    return out;
  }
  // 1px 어두운 외곽선
  function outlineG(g) {
    const out = gclone(g);
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++)
      if (g[y][x] === '.' && (isOn(g, x - 1, y) || isOn(g, x + 1, y) || isOn(g, x, y - 1) || isOn(g, x, y + 1))) out[y][x] = 'k';
    return out;
  }
  const solidG = (g, c) => g.map(r => r.map(ch => ch === '.' ? '.' : c));
  const darkG = g => g.map(r => r.map(ch => (SHADE[ch] && SHADE[ch][1]) || ch));
  function bakeG(g) {
    const cv = document.createElement('canvas');
    cv.width = gW(g); cv.height = gH(g);
    const c2 = cv.getContext('2d');
    g.forEach((r, y) => r.forEach((ch, x) => { if (ch !== '.') { c2.fillStyle = PAL[ch]; c2.fillRect(x, y, 1, 1); } }));
    return cv;
  }
  const finishG = g => bakeG(outlineG(shadeG(g)));

  // ----- 움직임 프레임 만들기 (발 줄 = 아래쪽 foot줄, 맨 아래 1줄은 외곽선 자리) -----
  function contentRows(g) {
    let top = g.length, bot = -1;
    g.forEach((r, y) => { if (r.some(c => c !== '.')) { top = Math.min(top, y); bot = Math.max(bot, y); } });
    return [top, bot];
  }
  // 몸(발 위쪽)만 dy칸 옮김: +1 = 아래로 눌림(숨쉬기), -1 = 위로 뜸(빈 줄은 다리로 채움)
  function shiftBody(g, foot, dy) {
    const h = gH(g), w = gW(g), [, bot] = contentRows(g), fTop = bot - foot + 1;
    const out = gblank(w, h);
    for (let y = fTop; y <= bot; y++) out[y] = g[y].slice();
    for (let y = 0; y < fTop; y++) {
      const ny = y + dy;
      if (ny < 0 || ny >= h) continue;
      for (let x = 0; x < w; x++) if (g[y][x] !== '.') out[ny][x] = g[y][x];
    }
    if (dy < 0) for (let x = 0; x < w; x++) if (out[fTop - 1][x] === '.' && g[fTop][x] !== '.') out[fTop - 1][x] = g[fTop][x];
    return out;
  }
  // 한쪽 발(왼쪽 절반 / 오른쪽 절반)을 1칸 들어 올림
  function liftFoot(g, foot, side) {
    const w = gW(g), [, bot] = contentRows(g), fTop = bot - foot + 1, out = gclone(g), cx = w / 2;
    for (let x = 0; x < w; x++) {
      if (side === 0 ? x >= cx : x < cx) continue;
      for (let y = fTop; y <= bot; y++) {
        if (g[y][x] !== '.') out[y - 1][x] = g[y][x];
      }
      if (g[bot][x] !== '.') out[bot][x] = '.';
    }
    return out;
  }
  // 위아래로 눌림(가운데 한 줄 빼기) / 늘어남(가운데 한 줄 더하기) — 다리가 없는 슬라임용
  function squashG(g, n) {
    const h = gH(g), w = gW(g), [top, bot] = contentRows(g), mid = Math.floor((top + bot) / 2);
    const out = gblank(w, h);
    if (n > 0) {
      for (let y = mid + 1; y <= bot; y++) out[y] = g[y].slice();
      for (let y = top; y < mid; y++) out[y + 1] = g[y].slice();
      // 눌리면 옆으로 1칸 퍼짐
      for (let y = mid; y <= bot; y++) for (let x = 1; x < w - 1; x++) {
        if (out[y][x] === '.' && out[y][x + 1] !== '.' && x + 1 < w / 2) out[y][x] = out[y][x + 1];
        if (out[y][x] === '.' && out[y][x - 1] !== '.' && x - 1 >= w / 2) { out[y][x] = out[y][x - 1]; x++; }
      }
    } else {
      for (let y = mid; y <= bot; y++) out[y] = g[y].slice();
      for (let y = top; y <= mid; y++) if (y - 1 >= 0) out[y - 1] = g[y].slice();
    }
    return out;
  }
  // 아래를 기준으로 세로 k배로 납작하게 (쓰러짐)
  function flattenG(g, k) {
    const h = gH(g), w = gW(g), [top, bot] = contentRows(g), hc = bot - top + 1, nh = Math.max(1, Math.round(hc * k));
    const out = gblank(w, h);
    for (let i = 0; i < nh; i++) {
      const sy = top + Math.min(hc - 1, Math.floor(i / k));
      out[bot - nh + 1 + i] = g[sy].slice();
    }
    return out;
  }
  // 정해진 무늬로 점점 부서짐
  function dissolveG(g, frac) {
    return g.map((r, y) => r.map((c, x) => {
      const hsh = Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
      return hsh < frac ? '.' : c;
    }));
  }
  // 그림 하나 → 대기 2 · 이동 4 · 피격 1(흰색) · 사망 3 프레임 + 도감 실루엣
  function makeSprite(g, foot) {
    let idle, move;
    if (foot > 0) {
      idle = [g, shiftBody(g, foot, 1)];
      const up = shiftBody(g, foot, -1);
      move = [liftFoot(g, foot, 0), up, liftFoot(g, foot, 1), up];
    } else {
      idle = [g, squashG(g, 1)];
      move = [g, squashG(g, 1), g, squashG(g, -1)];
    }
    return {
      w: gW(g), h: gH(g), top: contentRows(g)[0],
      idle: idle.map(finishG),
      move: move.map(finishG),
      hit: bakeG(outlineG(solidG(g, 'w'))),
      death: [finishG(darkG(flattenG(g, 0.7))), finishG(darkG(dissolveG(flattenG(g, 0.45), 0.3))), bakeG(outlineG(dissolveG(solidG(flattenG(g, 0.22), 'G'), 0.55)))],
      sil: bakeG(outlineG(solidG(g, 'K')))
    };
  }
  // 그리기: (x, y) = 발밑 가운데
  function drawPx(cv, x, y, flip, scale) {
    const s = scale || PX, w = cv.width * s, h = cv.height * s;
    const dx = Math.round(x - w / 2), dy = Math.round(y - h);
    if (flip) {
      ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1);
      ctx.drawImage(cv, 0, 0, w, h);
      ctx.restore();
    } else ctx.drawImage(cv, dx, dy, w, h);
  }
  // 가운데 기준으로 그리기 (아이콘)
  function drawPxC(cv, x, y, scale) {
    const s = scale || PX, w = cv.width * s, h = cv.height * s;
    ctx.drawImage(cv, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
  }

  // ----- 캐릭터 (정면) + 장착한 방어구가 그림에 보임 -----
  const ART_PLAYER = pgrid([
    '................',
    '.....dddddd.....',
    '....dddddddd....',
    '....dssssssd....',
    '....ssksskss....',
    '....ssssssss....',
    '.....SssssS.....',
    '....tttttttt....',
    '...stttttttts...',
    '...stttttttts...',
    '....tttttttt....',
    '....hhhhhhhh....',
    '....hhh..hhh....',
    '....hhh..hhh....',
    '....ddd..ddd....',
    '................'
  ]);
  const ART_HELMET = pgrid([
    '................',
    '.....XXXXXX.....',
    '....XxXXXXXX....',
    '....XZZZZZZX....',
    '....X......X....',
    '................', '................', '................', '................', '................',
    '................', '................', '................', '................', '................', '................'
  ]);
  const ART_ARMOR = pgrid([
    '................', '................', '................', '................', '................', '................', '................',
    '...ZXXXXXXXXZ...',
    '....XXXxxXXX....',
    '....XXXxxXXX....',
    '....ZZZZZZZZ....',
    '................', '................', '................', '................', '................'
  ]);
  const ART_PANTS = pgrid([
    '................', '................', '................', '................', '................', '................', '................',
    '................', '................', '................', '................',
    '....XXXXXXXX....',
    '....XXX..XXX....',
    '....XXX..XXX....',
    '................', '................'
  ]);
  const playerSprites = {};
  function playerSprite(hg, ag, pg) {   // 각 슬롯의 등급 번호 (없으면 -1)
    const key = hg + '|' + ag + '|' + pg;
    if (playerSprites[key]) return playerSprites[key];
    let g = ART_PLAYER;
    if (pg >= 0) g = overlayG(g, recolor(ART_PANTS, gradeMap(pg)));
    if (ag >= 0) g = overlayG(g, recolor(ART_ARMOR, gradeMap(ag)));
    if (hg >= 0) g = overlayG(g, recolor(ART_HELMET, gradeMap(hg)));
    return (playerSprites[key] = makeSprite(g, 3));
  }

  // ----- 손에 든 무기 (공격 타입별, X = 등급 색) — 오른쪽을 향한 그림, 90°씩 돌려서 씀 -----
  const ART_GUNS = {
    shot: pgrid([
      '............',
      '.GGGGGGGGX..',
      '.GggggggggG.',
      '.GGXGGGGGG..',
      '..dd........',
      '..dd........',
      '............'
    ]),
    spread: pgrid([
      '.............',
      '.BBGGGGGGGGX.',
      '.BBBggggggggG',
      '.BBGGGGGGGGX.',
      '..BB.........',
      '..BB.........',
      '.............'
    ]),
    laser: pgrid([
      '.............',
      '..GGGGGGGG...',
      '.GGXXXXggGbw.',
      '..GGGGGGGG...',
      '..dd.........',
      '..dd.........',
      '.............'
    ]),
    wave: pgrid([
      '............',
      '........xX..',
      '.BBBBBBBXwX.',
      '........ZX..',
      '............'
    ])
  };
  const gunSprites = {};
  function gunSprite(kind, gi) {
    const key = kind + '|' + gi;
    return gunSprites[key] || (gunSprites[key] = finishG(recolor(ART_GUNS[kind], gradeMap(gi))));
  }

  // ----- 강아지 코코 (옆모습, 오른쪽을 봄) -----
  const ART_COCO = pgrid([
    '................',
    '................',
    '................',
    '..........dd....',
    '.........dYYd...',
    '.........YYYYY..',
    '.........YkYYYd.',
    '.c.......YYYYY..',
    '.cc.....YYYYS...',
    '..cYYYYYYYYY....',
    '...YYYYYYYYY....',
    '...YYYYYYYYS....',
    '...Y.Y...Y.Y....',
    '...Y.Y...Y.Y....',
    '...B.B...B.B....',
    '................'
  ]);

  // ----- 숲의 적 8종 -----
  const ART_SQUIRREL = pgrid([
    '................',
    '................',
    '................',
    '..cc............',
    '.cBBc...........',
    '.cBBBc....B.B...',
    '.cBBBc....BBB...',
    '..cBBc...BBkBB..',
    '...cBBc..BBBBBd.',
    '....cBBBBBBYB...',
    '.....BBBBBBYB...',
    '.....BBBBBBYB...',
    '......BBBBBB....',
    '......BB..BB....',
    '......dd..dd....',
    '................'
  ]);
  const ART_SLIME = pgrid([
    '................',
    '................',
    '................',
    '................',
    '................',
    '................',
    '......nnnn......',
    '....nnnnnnnn....',
    '...nneennnnnn...',
    '..nneennnnnnnn..',
    '..nnnnknnnknnn..',
    '..nnnnnnnnnnnn..',
    '..nnnnNkkNnnnn..',
    '...nnnnnnnnnn...',
    '....NNNNNNNN....',
    '................'
  ]);
  const ART_BOAR = pgrid([
    '................',
    '................',
    '................',
    '................',
    '................',
    '...d.d.d........',
    '..dBBBBBBBd.....',
    '.dBBBBBBBBBBd...',
    '.BBBBBBBBBBBBB..',
    '.BBBBBBBBBBkBBc.',
    '.BBBBBBBBBBBBcc.',
    '..BBBBBBBBBBwB..',
    '..BBBBBBBBBBBB..',
    '..BB.BB..BB.BB..',
    '..dd.dd..dd.dd..',
    '................'
  ]);
  const ART_ARCHER = pgrid([
    '................',
    '................',
    '.......BB.......',
    '......BBBB...c..',
    '.....BBBBBB..lc.',
    '....BBnnnnBB.l.c',
    '...nBnknnknBnl.c',
    '....BnnnnnnB.l.c',
    '.....nnddnn..l.c',
    '....NNNNNNNNnl.c',
    '...nNNNNNNNN.l.c',
    '....NNNNNNNN.lc.',
    '....hhh..hhh.c..',
    '....hhh..hhh....',
    '....ddd..ddd....',
    '................'
  ].map(r => r.slice(0, 15) + '.'));
  const ART_WOLF = pgrid([
    '................',
    '................',
    '................',
    '..........g.g...',
    '.........gggg...',
    '........ggkggg..',
    '.g......gggggGk.',
    '.gg....ggggl....',
    '..gggggggggg....',
    '..gggggggggg....',
    '...ggggggggg....',
    '...gglllllgg....',
    '...g.g...g.g....',
    '...g.g...g.g....',
    '...G.G...G.G....',
    '................'
  ]);
  const ART_SHAMAN = pgrid([
    '................',
    '................',
    '.....RRRRRR.....',
    '...RRwRRRRwRR...',
    '..RRRRRRwwRRRR..',
    '..RwwRRRRRRRwR..',
    '...RRRRRRRRRR...',
    '.....YYYYYY..v..',
    '.....YkYYkY.vpv.',
    '.....YYYYYY..B..',
    '....YYYYYYYY.B..',
    '...SYYYYYYYYSB..',
    '.....YYYYYY..B..',
    '.....YY..YY..B..',
    '.....SS..SS.....',
    '................'
  ]);
  // 고대 트렌트 (32×32) — 나무 몸통, 잎 머리, 가지 팔, 빛나는 눈
  function artTrent() {
    const g = gblank(32, 32);
    gLine(g, 10, 16, 3, 22, 'B', 2); gLine(g, 21, 16, 27, 22, 'B', 2);
    gEllipse(g, 3.5, 22.5, 2.5, 2, 'n'); gEllipse(g, 28, 22.5, 2.5, 2, 'n');
    gRect(g, 10, 13, 21, 27, 'B');
    for (const x of [12, 16, 19]) gLine(g, x, 15, x, 26, 'd');
    gEllipse(g, 15.5, 8.5, 13, 7.5, 'n');
    gEllipse(g, 9, 6, 4, 3, 'e'); gEllipse(g, 20, 11, 5, 3, 'N'); gEllipse(g, 26, 8, 2.5, 2.5, 'N');
    gEllipse(g, 6, 11, 3, 2, 'N');
    gRect(g, 12, 17, 14, 18, 'k'); gRect(g, 17, 17, 19, 18, 'k');
    gPix(g, 13, 17, 'y'); gPix(g, 18, 17, 'y');

  function tileArt(kind, seed) {
    let s = seed * 9301 + 49297;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const g = gblank(16, 16);
    if (kind === 'grass' || kind === 'flower') {
      gRect(g, 0, 0, 15, 15, 'N');
      for (let i = 0; i < 9; i++) {
        const x = 1 + Math.floor(rnd() * 13), y = 2 + Math.floor(rnd() * 12);
        gPix(g, x, y, 'n'); gPix(g, x, y - 1, 'n'); if (rnd() < 0.4) gPix(g, x, y - 2, 'e');
      }
      for (let i = 0; i < 3; i++) gPix(g, Math.floor(rnd() * 15), Math.floor(rnd() * 15), 'f');
      if (kind === 'flower') {
        const fx = 3 + Math.floor(rnd() * 9), fy = 4 + Math.floor(rnd() * 8), fc = ['y', 'w', 'i'][Math.floor(rnd() * 3)];
        gPix(g, fx, fy, fc); gPix(g, fx - 1, fy, fc); gPix(g, fx + 1, fy, fc); gPix(g, fx, fy - 1, fc); gPix(g, fx, fy + 1, 'n');
      }
      gRect(g, 0, 15, 15, 15, 'f'); gRect(g, 15, 0, 15, 15, 'f');
    } else if (kind === 'rock' || kind === 'crack') {
      gRect(g, 0, 0, 15, 15, 'd');
      for (let i = 0; i < 6; i++) {
        const x = 1 + Math.floor(rnd() * 13), y = 1 + Math.floor(rnd() * 13);
        gPix(g, x, y, 'B'); if (rnd() < 0.5) gPix(g, x + 1, y, 'B'); gPix(g, x, y + 1, 'K');
      }
      if (kind === 'crack') {
        let x = 2 + Math.floor(rnd() * 4), y = 3 + Math.floor(rnd() * 8);
        for (let i = 0; i < 9; i++) { gPix(g, x, y, i % 3 === 1 ? 'O' : 'q'); x++; y += rnd() < 0.5 ? 1 : -1; y = Math.max(1, Math.min(14, y)); }
      }
      gRect(g, 0, 15, 15, 15, 'K'); gRect(g, 15, 0, 15, 15, 'K');
    } else if (kind === 'lava') {
      gRect(g, 0, 0, 15, 15, 'O');
      for (let i = 0; i < 7; i++) {
        const x = Math.floor(rnd() * 15), y = Math.floor(rnd() * 15);
        gPix(g, x, y, 'o'); gPix(g, x + 1, y, 'y');
      }
      for (let i = 0; i < 4; i++) gPix(g, Math.floor(rnd() * 16), Math.floor(rnd() * 16), 'R');
    } else if (kind === 'wall') {
      gRect(g, 0, 0, 15, 15, 'g');
      for (const y of [0, 5, 10, 15]) gRect(g, 0, y, 15, y, 'G');
      for (const [y0, xs] of [[1, [3, 11]], [6, [7, 15]], [11, [3, 11]]]) for (const x of xs) gRect(g, x, y0, x, y0 + 3, 'G');
      for (const [y0, xs] of [[1, [0, 4, 12]], [6, [0, 8]], [11, [0, 4, 12]]]) for (const x of xs) gRect(g, x, y0, x + 2, y0, 'l');
    }
    return g;
  }

  function round10(x) { const f = Math.floor(x + 1e-9); return Math.floor(f / 10) * 10 + (f % 10 >= 5 ? 10 : 0); }
  // (N-1)강 → N강 비용 = 100 × 1.5^(N-1) × 등급계수

  function rebuildFloorTiles() {

  const STAGE = {
    hpGrow: 0.5,    // 다음 스테이지 몬스터 체력: 들어갈 때 내 공격력 기준 +50%씩
    dmgGrow: 0.5,   // 스테이지마다 몬스터 공격력 +50%
    spdGrow: 0.15   // 스테이지마다 몬스터 속도 +15%

  const stage = { n: 1, hpMul: 1 };

  let portal = null;

  // 화산 지대 바닥 장식 (용암 웅덩이 — 밟아도 아무 일 없음)
  const LAVA = [];
  for (let i = 0; i < 46; i++) {
    let x, y;
    do { x = 120 + Math.random() * (WORLD.w - 240); y = 120 + Math.random() * (WORLD.h - 240); }
    while (Math.hypot(x - WORLD.w / 2, y - WORLD.h / 2) < 260);
    LAVA.push({ x, y, rx: 26 + Math.random() * 46, ry: 16 + Math.random() * 26, rot: Math.random() * Math.PI, ph: Math.random() * 6 });
  }
  // 용암 웅덩이가 덮는 칸 (화산 지대에서는 장애물 — 적이 이 칸에서 나오지 않음)
  const lavaSet = new Set();
  for (const l of LAVA) {
    const R = Math.max(l.rx, l.ry), c = Math.cos(-l.rot), sn = Math.sin(-l.rot);
    lavaSet.add(Math.floor(l.y / TILE) * TILES + Math.floor(l.x / TILE));
    for (let ty = Math.floor((l.y - R) / TILE); ty <= Math.floor((l.y + R) / TILE); ty++)
      for (let tx = Math.floor((l.x - R) / TILE); tx <= Math.floor((l.x + R) / TILE); tx++) {
        if (tx < 0 || ty < 0 || tx >= TILES || ty >= TILES) continue;
        const dx = (tx + 0.5) * TILE - l.x, dy = (ty + 0.5) * TILE - l.y, u = dx * c - dy * sn, v = dx * sn + dy * c;
        if ((u / l.rx) ** 2 + (v / l.ry) ** 2 <= 1) lavaSet.add(ty * TILES + tx);
      }
  }

  // ===== 몬스터 (숲의 적 8종 — '출현' 규칙으로 나타남) =====
  const monsters = [];

  // ===== 몬스터 공격 / 히트박스 =====
  // 가까이 오면 멈춰서 빨간 히트박스를 예고(windup) → 휘두름(attack) → 쉬기
  const ATK = {
    range: 95,        // 이 거리 안에 들어오면 공격 시작
    windup: 0.55,     // 예고 시간
    active: 0.15,     // 히트박스가 실제로 판정하는 시간

    reach: 26,        // 몬스터 몸 끝에서 히트박스 중심까지
    hbR: 24,          // 히트박스 반지름
    dmg: 1
  };
  function hitboxOf(m) {
    const reach = m.reach || ATK.reach;
    return { x: m.x + m.ax * (m.r + reach), y: m.y + m.ay * (m.r + reach), r: m.hbR || ATK.hbR };
  }
  const SPAWN = { x: WORLD.w / 2, y: WORLD.h / 2 };
  function hurtPlayer(dmg, fromX, fromY) {
    if (dash.inv > 0) { showDodge(); return; }   // 대쉬 무적: 공격을 피함
    if (player.invuln > 0) return;
    // 받는 피해 = 공격 × 100 ÷ (100 + 방어력) (반올림, 최소 1) — 스테이지가 오를수록 공격이 세짐
    dmg = takenDamage(dmg * stageGrow(STAGE.dmgGrow), totalDefense());
    player.hp = Math.max(0, player.hp - dmg);
    player.invuln = 0.7;
    player.hurt = 0.3;
    const dx = player.x - fromX, dy = player.y - fromY, d = Math.hypot(dx, dy) || 1;
    player.kbx = dx / d * 420; player.kby = dy / d * 420;
    floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '-' + dmg, color: '255,90,80' });
    if (player.hp <= 0) {
      poofs.push({ x: player.x, y: player.y, t: 0 });
      corpses.push({ sp: playerSprite(eqGrade(equip.helmet), eqGrade(equip.armor), eqGrade(equip.pants)), x: player.x, y: player.y, r: player.r, flip: false, t: 0 });
      floats.push({ x: SPAWN.x, y: SPAWN.y - player.r - 30, t: 0, text: '쓰러졌다! 다시 시작', color: '255,90,80' });
      player.x = SPAWN.x; player.y = SPAWN.y;
      player.hp = player.maxHp;
      player.kbx = player.kby = 0;

    }
  }

  // ===== 중간 보스 = 고대 트렌트 (일정 시간마다 작은 몹을 불러냄 + 패턴) =====
  const BOSS = {
    summonEvery: 5,   // 초마다 소환
    summonCount: 2,   // 한 번에 소환하는 수
    maxMinions: 8,    // 보스 한 마리당 살아 있을 수 있는 작은 몹 수
    // 패턴
    patterns: ['fan', 'ring', 'charge', 'slam'],
    patEvery: 2.6, patRange: 560,
    fanShots: 5, fanSpread: 0.2, fanVolleys: 2,
    ringShots: 12, rings: 1,
    shotSpeed: 250, shotR: 8, shotColor: '255,110,70',   // 탄 피해 = 공격력의 절반, 돌진·내려찍기 = 공격력
    chargeSpeed: 600,
    slamR: 130
  };
  // ===== 최종 보스 = 숲의 군주 — 플레이어를 쫓아오며 패턴 =====
  const FINAL = {
    patterns: ['fan', 'ring', 'charge', 'slam'],
    patEvery: 1.6, patRange: 700,
    fanShots: 7, fanSpread: 0.16, fanVolleys: 4,
    ringShots: 20, rings: 2,
    shotSpeed: 330, shotR: 10, shotColor: '200,120,255',
    chargeSpeed: 780,
    slamR: 170
  };
  const banner = { text: '', t: 0, color: '255,214,90' };
  // ===== 보스 원거리 탄 / 패턴 =====
  const enemyShots = [];
  const PAT = { fanWind: 0.5, fanGap: 0.22, ringWind: 0.7, ringGap: 0.35, chargeWind: 0.7, chargeDur: 0.5, slamWind: 0.9 };
  function bossShoot(m, B, a) {
    enemyShots.push({
      x: m.x + Math.cos(a) * m.r, y: m.y + Math.sin(a) * m.r,
      vx: Math.cos(a) * B.shotSpeed, vy: Math.sin(a) * B.shotSpeed,
      r: B.shotR, life: 3.5, dmg: Math.round(m.atk * 0.5), color: B.shotColor
    });
  }
  // 패턴 진행 중이면 true (그동안 평소 이동/근접 공격은 쉼)
  function updateBossPattern(m, dt, pdx, pdy, pd) {
    const B = m.final ? FINAL : BOSS;
    if (!m.pat) {
      m.patCd -= dt;
      if (m.patCd > 0 || m.state !== 'wander' || pd > B.patRange) return false;
      m.pat = B.patterns[Math.floor(Math.random() * B.patterns.length)];
      m.pt = 0; m.fired = 0; m.dealt = false;
      m.aim = Math.atan2(pdy, pdx);
    }
    m.pt += dt;
    const toP = Math.atan2(pdy, pdx);
    let done = false;
    if (m.pat === 'fan') {
      // 부채꼴 조준 사격 (여러 번 연사)
      m.aim = toP;
      while (m.fired < B.fanVolleys && m.pt >= PAT.fanWind + m.fired * PAT.fanGap) {
        for (let s = 0; s < B.fanShots; s++) bossShoot(m, B, m.aim + (s - (B.fanShots - 1) / 2) * B.fanSpread);
        m.fired++;
      }
      done = m.fired >= B.fanVolleys && m.pt >= PAT.fanWind + B.fanVolleys * PAT.fanGap + 0.2;
    } else if (m.pat === 'ring') {
      // 사방으로 퍼지는 탄막
      while (m.fired < B.rings && m.pt >= PAT.ringWind + m.fired * PAT.ringGap) {
        const off = m.fired * Math.PI / B.ringShots + toP;
        for (let i = 0; i < B.ringShots; i++) bossShoot(m, B, off + i * Math.PI * 2 / B.ringShots);
        m.fired++;
      }
      done = m.fired >= B.rings && m.pt >= PAT.ringWind + B.rings * PAT.ringGap + 0.2;
    } else if (m.pat === 'charge') {
      // 돌진
      if (m.pt < PAT.chargeWind) {
        m.aim = toP; m.vx = Math.cos(toP); m.vy = Math.sin(toP);
      } else if (m.pt < PAT.chargeWind + PAT.chargeDur) {
        m.x += Math.cos(m.aim) * B.chargeSpeed * dt;
        m.y += Math.sin(m.aim) * B.chargeSpeed * dt;
        if (!m.dealt && Math.hypot(player.x - m.x, player.y - m.y) < m.r + player.r) {
          m.dealt = true;
          hurtPlayer(m.atk, m.x, m.y);
        }
      } else done = m.pt >= PAT.chargeWind + PAT.chargeDur + 0.35;
    } else if (m.pat === 'slam') {
      // 내려찍기 (넓은 범위)
      if (!m.dealt && m.pt >= PAT.slamWind) {
        m.dealt = true; m.slamFx = 1;
        if (pd < B.slamR + player.r) hurtPlayer(m.atk, m.x, m.y);
      }
      done = m.pt >= PAT.slamWind + 0.35;
    }
    if (done) { m.pat = null; m.patCd = B.patEvery * (0.7 + Math.random() * 0.6); }
    return true;
  }
  // 트렌트가 부르는 작은 몹: 다람쥐·슬라임 (동시에 30마리를 넘지 않음)
  function spawnMinion(boss) {
    if (monsters.length >= SPAWN_RULE.cap) return;

  // ===== 아이템 (몬스터가 죽으면 떨어짐, 먹으면 공격력이 2배씩 = 기하급수) =====
  const items = [];

  const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];
  function fmtPower(n) {
    if (!isFinite(n)) return '∞';
    if (n < 10000) return String(Math.round(n * 10) / 10);
    const u = Math.floor(Math.log10(n) / 4);
    if (u >= UNITS.length) return '2^' + power.level;
    const v = n / Math.pow(10000, u);
    return (v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10) + UNITS[u];

  // ===== 30초마다 능력 선택 (여러 능력 중 무작위 3장) + 가끔 잭팟 =====
  const PICK = {

  };
  const BASE_SPEED = player.speed;
  const pick = {
    t: 0, open: false, openT: 0, sel: 0, dmgN: 0, hpN: 0, rateN: 0,
    jackpot: false, cards: [],

  };
  function dmgMul() { return 1 + PICK.dmgStep * pick.dmgN; }
  function playerMul() { return power.dmg * dmgMul(); }
  // 탄 1발(레이저 1틱 · 파동 1회) 대미지 = 무기 강화표 대미지 × 공격력 아이템 × 능력 (집중 레이저 중에는 2배)
  function playerDmg() { return wStat(equip.weapon).dmg * playerMul() * (skill.focusT > 0 ? 2 : 1); }
  // 다음 공격까지 걸리는 시간 = 1 ÷ 공속 (연사 능력 1번당 ×0.85)
  function fireRate() { return Math.max(PICK.minRate, 1 / wStat(equip.weapon).rate * Math.pow(PICK.rateStep, pick.rateN)); }
  function totalShots() { return wStat(equip.weapon).cnt + (equip.weapon.def.kind === 'wave' ? 0 : pick.extraShots); }
  function regenEvery(n) { return Math.max(1, PICK.regenBase * Math.pow(PICK.regenStep, n - 1)); }
  function magnetRange() { return PICK.magnetStep * pick.magnetN; }
  function sayPick(text, color) { floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text, color }); }

  // 잭팟 능력 수치
  const BLADE = { orbit: 74, r: 13, spin: 3.6, cd: 0.25, first: 3, more: 2, max: 9 };

  // 평소 능력 (기존 3개 + 새 능력)
  const PICK_OPTIONS = [
    { title: '데미지 증가', desc: () => '공격력 +50%  (지금 ×' + dmgMul() + ' → ×' + (dmgMul() + PICK.dmgStep) + ')', color: '255,140,90',

      apply() { pick.rateN++; sayPick('연사 속도 증가!', this.color); } },

  const JACKPOT_OPTIONS = [

  ];
  function boltTargets() { return BOLT.first + BOLT.more * Math.max(0, pick.boltN - 1); }

  function rollCards(pool, n, except) {
    const a = pool.filter(o => (!o.can || o.can()) && !(except || []).includes(o));
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a.slice(0, n);
  }
  function pickReadyT() { return pick.jackpot ? 0.6 : 0.35; }
  function openPick() {
    pick.open = true; pick.openT = 0; pick.sel = 0;

    // 잭팟 능력을 거의 다 모았으면 남는 칸은 평소 능력으로 채움
    if (pick.cards.length < 3) pick.cards = pick.cards.concat(rollCards(PICK_OPTIONS, 3 - pick.cards.length, pick.cards));
    for (const k in keys) keys[k] = false;
    stickEnd();
    fireBtn.pressed = false; fireBtn.id = null;
  }
  function choosePick(i) {

  }
  function pickCardRects() {
    const cw = Math.min(W - 40, 340), ch = 78, gap = 14;

  // 강화 수치는 0강부터 다시 시작. 저장 기능이 없어 새로 켜면 쓴 골드도 없으므로 환급할 골드는 0.

  // 오른쪽 위 버튼: 대장간 · 뽑기 · 장비 · 도감
  const HUD_BTNS = [

  // ===== 강아지 친구 '코코' — 졸졸 따라다니다가 근처에 떨어진 전리품(재료·무기·악세서리)을 물어 옴 =====
  const PET = {
    r: 12,
    follow: 46,       // 캐릭터와 이 거리쯤 떨어져서 따라옴
    speed: 300,       // 따라갈 때 최고 속도 (캐릭터가 빨라지면 같이 빨라짐)
    fetchSpeed: 400,  // 코인 주우러 뛰어갈 때 속도
    sniff: 260,       // 코코 주변 이 거리 안의 코인을 찾아감
    leash: 380,       // 캐릭터에게서 이보다 먼 코인은 안 감
    warp: 700,        // 이보다 멀어지면 캐릭터 곁으로 뿅 하고 나타남
    sayDur: 4         // 처음 인사 말풍선 시간
  };
  const pet = {
    x: SPAWN.x - 46, y: SPAWN.y + 24, r: PET.r,
    dirX: 1, dirY: 0, moving: false, walk: 0, wag: 0,
    target: null, happy: 0,
    say: '떨어진 건 내가 물어 올게!', sayT: PET.sayDur
  };
  banner.text = '새 친구 · 강아지 코코'; banner.t = 3.5; banner.color = '255,214,150';
  function updatePet(dt) {
    pet.happy = Math.max(0, pet.happy - dt);
    pet.sayT = Math.max(0, pet.sayT - dt);
    // 너무 멀어지면 (쓰러져서 처음 자리로 갔거나 다음 스테이지) 곁으로 뿅
    if (Math.hypot(player.x - pet.x, player.y - pet.y) > PET.warp) {
      pet.x = player.x - player.dirX * PET.follow;
      pet.y = player.y - player.dirY * PET.follow;
      pet.target = null;
      poofs.push({ x: pet.x, y: pet.y, t: 0 });
    }
    // 물어 올 코인 고르기 (바닥에 내려앉은 코인 중 가장 가까운 것)
    const t = pet.target;
    if (t && (!loots.includes(t) || Math.hypot(t.x - player.x, t.y - player.y) > PET.leash + 60)) pet.target = null;
    if (!pet.target) {
      let bd = PET.sniff;
      for (const c of loots) {
        if (c.t < 0.3 || Math.hypot(c.x - player.x, c.y - player.y) > PET.leash) continue;
        const d = Math.hypot(c.x - pet.x, c.y - pet.y);
        if (d < bd) { bd = d; pet.target = c; }
      }
    }
    // 움직이기: 코인이 있으면 그쪽으로, 없으면 캐릭터를 따라감
    let vx = 0, vy = 0;
    if (pet.target) {
      const c = pet.target, dx = c.x - pet.x, dy = c.y - pet.y, d = Math.hypot(dx, dy) || 1;
      const mv = Math.min(d, Math.max(PET.fetchSpeed, player.speed * 1.3) * dt);
      vx = dx / d * mv; vy = dy / d * mv;
    } else {
      const dx = player.x - pet.x, dy = player.y - pet.y, d = Math.hypot(dx, dy) || 1;
      if (d > PET.follow) {
        const sp = Math.min(Math.max(PET.speed, player.speed * 1.25), (d - PET.follow) * 6);
        const mv = Math.min(d - PET.follow, sp * dt);
        vx = dx / d * mv; vy = dy / d * mv;
      } else if (d < player.r + PET.r + 6) {
        const mv = 40 * dt;   // 너무 붙으면 살짝 비켜섬
        vx = -dx / d * mv; vy = -dy / d * mv;
      }
    }
    pet.x = Math.max(PET.r, Math.min(WORLD.w - PET.r, pet.x + vx));
    pet.y = Math.max(PET.r, Math.min(WORLD.h - PET.r, pet.y + vy));
    const step = Math.hypot(vx, vy);
    pet.moving = dt > 0 && step / dt > 20;
    if (pet.moving) {
      pet.dirX = vx / step; pet.dirY = vy / step;
      pet.walk += dt * 16;
    } else {
      // 멈추면 캐릭터 쪽을 바라봄
      const dx = player.x - pet.x, dy = player.y - pet.y, d = Math.hypot(dx, dy);
      if (d > 1) { pet.dirX = dx / d; pet.dirY = dy / d; }
      pet.walk = 0;
    }
    pet.wag += dt * (pet.happy > 0 ? 22 : pet.moving ? 14 : 7);
    // 물기 → 바로 내 가방으로
    const c = pet.target;
    if (c && Math.hypot(c.x - pet.x, c.y - pet.y) < PET.r + LOOT.r + 2) {
      loots.splice(loots.indexOf(c), 1);
      collectLoot(c, pet.x, pet.y);
      pet.target = null;
      pet.happy = 0.45;
    }
  }

  // ===== 아이템 뽑기 (코인을 내고 무작위 아이템 하나) =====
  const GACHA = {

  };
  const RARITY = [
    { name: '일반', stars: '★', color: '200,210,225' },
    { name: '희귀', stars: '★★', color: '110,190,255' },

  const gacha = { open: false, openT: 0, state: 'idle', rt: 0, tick: 0, name: '', spin: 0, knob: 0, prize: null, fx: 0, shake: 0, msg: '', msgColor: '255,255,255', msgT: 0, count: 0 };
  function gachaPool(rar) {
    const avail = o => !o.can || o.can();
    if (rar === 2) return JACKPOT_OPTIONS.filter(avail).map(o => ({ rar: 2, title: o.title, desc: o.desc(), color: o.color, apply: () => o.apply() }));
    if (rar === 1) {
      const pool = PICK_OPTIONS.filter(avail).map(o => ({ rar: 1, title: o.title, desc: o.desc(), color: o.color, apply: () => o.apply() }));
      if (weapon.tier < WEAPON_CHAIN.length - 1) {
        const cw = WPN[WEAPON_CHAIN[weapon.tier]], nw = WPN[WEAPON_CHAIN[weapon.tier + 1]];
        pool.push({ rar: 1, title: '무기 업그레이드', desc: cw.name + ' → ' + nw.name + ' (' + GRADES[nw.grade].name + ')', color: nw.color, apply: upgradeWeapon });
      }

    }
    return [{ rar: 0, title: '공격력 아이템', desc: '공격력 ×2  (' + fmtPower(playerDmg()) + ' → ' + fmtPower(playerDmg() * 2) + ')', color: '255,120,90',
      apply() { const t = weapon.tier; eatItem(); if (weapon.tier > t) this.bonus = '보너스! 무기 업그레이드 → ' + WPN[WEAPON_CHAIN[weapon.tier]].name; } }];
  }
  function rollGachaPrize() {
    const r = Math.random();
    let rar = r < GACHA.legend ? 2 : r < GACHA.legend + GACHA.rare ? 1 : 0;
    let pool = gachaPool(rar);
    while (!pool.length && rar > 0) pool = gachaPool(--rar);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  let GACHA_NAMES = null;
  function gachaRandomName() {
    if (!GACHA_NAMES) GACHA_NAMES = ['공격력 아이템', '무기 업그레이드'].concat(PICK_OPTIONS.map(o => o.title), JACKPOT_OPTIONS.map(o => o.title));
    let n;

  function gachaMsg(text, color) { gacha.msg = text; gacha.msgColor = color; gacha.msgT = 1.6; }
  function openGacha() {
    if (gacha.open || menu.open || pick.open || trans.active) return;
    gacha.open = true; gacha.openT = 0; gacha.state = 'idle'; gacha.prize = null; gacha.msgT = 0; gacha.fx = 0;

  function closeGacha() { if (gacha.state !== 'roll') gacha.open = false; }   // 뽑는 중에는 닫히지 않음
  function pullGacha() {
    if (!gacha.open || gacha.state === 'roll') return;
    if (wallet.gold < GACHA.cost) { gachaMsg('골드가 부족해요 (' + (GACHA.cost - wallet.gold) + 'G 더 필요)', '255,110,100'); gacha.shake = 1; return; }
    wallet.gold -= GACHA.cost;
    gacha.prize = rollGachaPrize();
    gacha.state = 'roll'; gacha.rt = 0; gacha.tick = 0; gacha.msgT = 0; gacha.fx = 0;
  }
  function updateGachaUi(dt) {
    gacha.openT += dt;

    if (gacha.rt >= GACHA.roll) {

  function damageMonster(m, dmg, kx, ky) {
    if (m.dead) return;
    m.hp -= takenDamage(dmg, m.defense);   // 적도 같은 공식으로 방어력만큼 덜 아픔
    m.hit = 0.12;
    if (!ccImmune(m)) { m.x += kx; m.y += ky; }
    if (m.hp > 0) return;
    const j = monsters.indexOf(m);
    if (j < 0) return;
    m.dead = true;
    monsters.splice(j, 1);
    const d = m.def;
    poofs.push({ x: m.x, y: m.y, t: 0 });
    corpses.push({ sp: enemySprite(d), x: m.x, y: m.y, r: m.r, flip: m.face < 0, t: 0 });   // 사망 3프레임
    dex[d.id].seen = true; dex[d.id].kills++;
    items.push({ x: m.x, y: m.y, r: 11, t: 0 });
    // 골드는 처치 즉시 (스테이지 번호만큼 곱함 · 행운의 동전 +15%)
    giveGold(Math.round(d.gold * stage.n * (1 + goldBonus())), m.x, m.y);
    for (const [id, p] of d.drop) if (Math.random() < p) dropLoot(m.x, m.y, 'mat', id);
    if (d.wpn && Math.random() < d.wpn) {
      const pool = WEAPON_DEFS.filter(w => w.grade === d.grade);   // 해당 등급 무기 중 무작위, 항상 0강
      dropLoot(m.x, m.y, 'wpn', pool[Math.floor(Math.random() * pool.length)].id);
    }
    if (d.acc && Math.random() < d.acc) dropLoot(m.x, m.y, 'acc', ACC_DEFS[Math.floor(Math.random() * ACC_DEFS.length)].id);
    if (warn.boss === m) warn.boss = null;
    if (m.boss) {
      floats.push({ x: m.x, y: m.y - m.r - 20, t: 0, text: '중간 보스 처치!', color: '255,120,90' });

  function eatItem() {

  // ===== 공격 타입 4종 — 투사체(단발 직선) · 산탄(부채꼴) · 레이저(누르는 동안 관통 빔, 8칸) · 파동(반경 4칸 충격파) =====
  const SHOT = { lat: 7, ang: 0.012 };    // 투사체: 나란히 쏘는 간격(px)과 탄 하나당 벌어지는 각도 → 탄이 늘수록 넓게 퍼짐
  const SPREAD = { fan: 0.34, lat: 5 };   // 산탄: 부채꼴 각도와 탄 사이 간격 → 5칸 거리 1칸 표적에 약 60% 명중
  const laser = { on: false, t: 0 };
  const waves = [];
  function fireWeapon() {
    const it = equip.weapon, wd = it.def, dmg = playerDmg();
    if (wd.kind === 'laser') { laserTick(dmg); return; }
    if (wd.kind === 'wave') { wavePulse(dmg); return; }
    gun.recoil = 1;
    const n = totalShots(), base = Math.atan2(player.dirY, player.dirX), px = -player.dirY, py = player.dirX;
    const mx = player.x + player.dirX * (player.r + 14), my = player.y + player.dirY * (player.r + 14);
    const thick = 4 + Math.min(power.level, 8);
    for (let s = 0; s < n; s++) {
      const off = s - (n - 1) / 2;
      let a, lat, w;
      if (wd.kind === 'spread') {
        // 부채꼴을 탄 수만큼 나눠 한 칸에 한 발씩 — 옆 간격이 있어서 탄끼리 겹치지 않음
        a = base - SPREAD.fan / 2 + (s + Math.random()) * SPREAD.fan / n; lat = off * SPREAD.lat; w = 4;
      } else {
        // 나란히 쏘고, 탄이 늘면 퍼지는 각도도 넓어짐 (굵기는 간격보다 가늘게 해서 겹치지 않게)
        a = base + off * SHOT.ang; lat = off * SHOT.lat; w = n > 1 ? Math.min(thick, SHOT.lat - 2) : thick;
      }
      bullets.push({
        x: mx + px * lat, y: my + py * lat,
        vx: Math.cos(a) * gun.bulletSpeed, vy: Math.sin(a) * gun.bulletSpeed,
        spd: gun.bulletSpeed, color: wd.color, glow: wd.grade >= 2, life: gun.bulletLife, w, dmg,
        pierce: pick.pierceN, hits: pick.pierceN ? [] : null, homing: pick.homing
      });
    }
  }
  function laserBeams() {
    const n = totalShots(), base = Math.atan2(player.dirY, player.dirX), out = [];
    const sx = player.x + player.dirX * (player.r + 10), sy = player.y + player.dirY * (player.r + 10), L = LASER.range * TILE - (player.r + 10);   // 캐릭터에서 8칸까지
    for (let s = 0; s < n; s++) {
      const a = base + (s - (n - 1) / 2) * 0.12;
      out.push({ x0: sx, y0: sy, x1: sx + Math.cos(a) * L, y1: sy + Math.sin(a) * L });
    }
    return out;
  }
  function segDist(px, py, b) {
    const dx = b.x1 - b.x0, dy = b.y1 - b.y0, l2 = dx * dx + dy * dy;
    const t = Math.max(0, Math.min(1, ((px - b.x0) * dx + (py - b.y0) * dy) / l2));
    return Math.hypot(px - (b.x0 + dx * t), py - (b.y0 + dy * t));
  }
  // 레이저 한 틱: 빔에 닿은 적을 모두 관통해서 맞힘
  function laserTick(dmg) {
    for (const b of laserBeams())
      for (const m of monsters.slice())
        if (segDist(m.x, m.y, b) < m.r + LASER.width / 2) damageMonster(m, dmg, 0, 0);
  }
  // 파동 1회: 플레이어 중심 반경 4칸 안의 적을 모두 맞힘
  function wavePulse(dmg) {
    const R = WAVE.r * TILE;
    waves.push({ x: player.x, y: player.y, t: 0, r: R, color: equip.weapon.def.color });
    for (const m of monsters.slice())
      if (Math.hypot(m.x - player.x, m.y - player.y) <= R + m.r) damageMonster(m, dmg, 0, 0);
  }
  function effectiveCP() {
    const wd = equip.weapon.def, n = wd.kind === 'wave' ? 1 : totalShots();
    return playerDmg() * n * wd.acc / fireRate();
  }

  // ===== 적 공격 (근접 · 돌진 · 화살 · 독장판) =====
  const ARROW = { wind: 0.5, cd: 1.6, speed: 330 };                 // 고블린 궁수 화살 / 숲의 군주 마력탄
  const POOL = { wind: 0.8, cd: 3, r: 1.1, life: 4 };               // 버섯 주술사 독장판 (반경 칸)
  const CHARGE = { trigger: 4, wind: 0.6, dur: 0.5, speed: 9, cd: 2 };   // 멧돼지 돌진 (시작 거리·속도는 칸)
  const pools = [];
  const corpses = [];
  function enemyFire(m) {
    const a = Math.atan2(player.y - m.y, player.x - m.x), orb = !!m.final;
    const sp = orb ? 300 : ARROW.speed, life = (m.def.range + 2) * TILE / sp;
    enemyShots.push({
      x: m.x + Math.cos(a) * m.r, y: m.y + Math.sin(a) * m.r, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: orb ? 9 : 5, life, dmg: m.atk, color: orb ? '200,120,255' : '230,200,150', arrow: !orb
    });
  }
  function updateMonsterAttack(m, dt, pdx, pdy, pd) {
    const k = m.def.kind, edge = pd - player.r - m.r, rangePx = m.def.range * TILE;
    if (m.state === 'wander' && m.atkCd <= 0) {
      if (k === 'melee' && edge < rangePx) { m.state = 'windup'; m.st = 0; m.dealt = false; m.ax = pdx / (pd || 1); m.ay = pdy / (pd || 1); }
      else if (k === 'arrow' && edge < rangePx) { m.state = 'aim'; m.st = 0; }
      else if (k === 'pool' && edge < rangePx) { m.state = 'cast'; m.st = 0; m.tx = player.x; m.ty = player.y; }
      else if (k === 'charge' && edge < CHARGE.trigger * TILE) { m.state = 'cwind'; m.st = 0; m.aim = Math.atan2(pdy, pdx); }
    }
    if (m.state === 'windup') {
      m.st += dt;
      // 예고 중에는 플레이어 쪽으로 천천히 조준
      const tx = pdx / (pd || 1), ty = pdy / (pd || 1);
      m.ax += (tx - m.ax) * Math.min(1, dt * 4); m.ay += (ty - m.ay) * Math.min(1, dt * 4);
      const al = Math.hypot(m.ax, m.ay) || 1; m.ax /= al; m.ay /= al;
      m.vx = m.ax; m.vy = m.ay;
      if (m.st >= ATK.windup) { m.state = 'attack'; m.st = 0; }
      return true;
    }
    if (m.state === 'attack') {
      m.st += dt;
      const hb = hitboxOf(m);
      if (!m.dealt && Math.hypot(player.x - hb.x, player.y - hb.y) < hb.r + player.r) {
        m.dealt = true;
        hurtPlayer(m.atk, m.x, m.y);
      }
      if (m.st >= ATK.active) { m.state = 'wander'; m.atkCd = ATK.cooldown; m.turn = 0.5 + Math.random(); }
      return true;
    }
    if (m.state === 'aim') {
      m.st += dt; m.vx = pdx / (pd || 1); m.vy = pdy / (pd || 1);
      if (m.st >= ARROW.wind) { enemyFire(m); m.state = 'wander'; m.atkCd = m.final ? 1.2 : ARROW.cd; }
      return true;
    }
    if (m.state === 'cast') {
      m.st += dt;
      if (m.st >= POOL.wind) {
        pools.push({ x: m.tx, y: m.ty, r: POOL.r * TILE, t: 0, life: POOL.life, dmg: m.atk });
        m.state = 'wander'; m.atkCd = POOL.cd;
      }
      return true;
    }
    if (m.state === 'cwind') {
      m.st += dt;
      if (m.st < CHARGE.wind * 0.6) m.aim = Math.atan2(pdy, pdx);   // 처음엔 따라 조준하다가 멈춤
      m.vx = Math.cos(m.aim); m.vy = Math.sin(m.aim);
      if (m.st >= CHARGE.wind) { m.state = 'charge'; m.st = 0; m.dealt = false; }
      return true;
    }
    if (m.state === 'charge') {
      m.st += dt;
      m.x += Math.cos(m.aim) * CHARGE.speed * TILE * dt;
      m.y += Math.sin(m.aim) * CHARGE.speed * TILE * dt;
      if (!m.dealt && Math.hypot(player.x - m.x, player.y - m.y) < m.r + player.r) { m.dealt = true; hurtPlayer(m.atk, m.x, m.y); }
      if (m.st >= CHARGE.dur) { m.state = 'wander'; m.atkCd = CHARGE.cd; m.turn = 0.3; }
      return true;
    }
    return false;
  }

  // ===== 카메라 =====
  const cam = { x: 0, y: 0 };

  // 노치가 있는 폰에서 위쪽 표시가 가려지지 않게 안전 영역 확인
  const safeProbe = document.createElement('div');
  safeProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);';
  document.body.appendChild(safeProbe);
  let safeTop = 0;

  // ===== 화면 크기 =====
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;   // 픽셀아트를 정수 배율로 또렷하게
    safeTop = parseFloat(getComputedStyle(safeProbe).paddingTop) || 0;
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== 키보드 입력 =====
  const keys = {};
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'fire', KeyJ: 'fire'
  };
  // e.code가 비어 있는 환경을 위해 e.key로도 확인
  const KEYMAP_BY_KEY = {
    ArrowUp: 'up', Up: 'up', w: 'up', W: 'up', 'ㅈ': 'up',
    ArrowDown: 'down', Down: 'down', s: 'down', S: 'down', 'ㄴ': 'down',
    ArrowLeft: 'left', Left: 'left', a: 'left', A: 'left', 'ㅁ': 'left',
    ArrowRight: 'right', Right: 'right', d: 'right', D: 'right', 'ㅇ': 'right',
    ' ': 'fire', Spacebar: 'fire', j: 'fire', J: 'fire', 'ㅓ': 'fire'
  };
  const keyOf = e => KEYMAP[e.code] || KEYMAP_BY_KEY[e.key];
  document.addEventListener('keydown', e => {
    if (pick.open) {
      // 능력 선택: 1/2/3 바로 선택, 위아래로 고르고 Enter/Space로 결정
      const n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code] ?? { '1': 0, '2': 1, '3': 2 }[e.key];
      const k = keyOf(e);
      if (n !== undefined) choosePick(n);
      else if (k === 'up' || k === 'left') pick.sel = (pick.sel + pick.cards.length - 1) % pick.cards.length;
      else if (k === 'down' || k === 'right') pick.sel = (pick.sel + 1) % pick.cards.length;
      else if (!e.repeat && (k === 'fire' || e.key === 'Enter')) choosePick(pick.sel);
      e.preventDefault();
      return;
    }
    const isShopKey = e.code === 'KeyE' || e.key === 'e' || e.key === 'E' || e.key === 'ㄷ';
    const isGachaKey = e.code === 'KeyG' || e.key === 'g' || e.key === 'G' || e.key === 'ㅎ';
    const isBagKey = e.code === 'KeyI' || e.key === 'i' || e.key === 'I' || e.key === 'ㅑ';
    const isDexKey = e.code === 'KeyB' || e.key === 'b' || e.key === 'B' || e.key === 'ㅠ';
    const isSkillKey = e.code === 'KeyQ' || e.key === 'q' || e.key === 'Q' || e.key === 'ㅂ';
    if (menu.open) {
      // 메뉴: E·I·B로 탭 바로 가기(같은 탭이면 닫기), Tab으로 다음 탭, Esc로 닫기
      const tabKey = isShopKey ? 'forge' : isBagKey ? 'equip' : isDexKey ? 'dex' : null;
      if (!e.repeat && e.key === 'Escape') closeMenu();
      else if (!e.repeat && tabKey) { if (menu.tab === tabKey) closeMenu(); else menu.tab = tabKey; }
      else if (!e.repeat && e.key === 'Tab') { const i = MENU_TABS.findIndex(t => t.key === menu.tab); menu.tab = MENU_TABS[(i + 1) % MENU_TABS.length].key; }
      else menuKey(e);
      e.preventDefault();
      return;
    }
    if (gacha.open) {
      // 아이템 뽑기: Space/Enter로 뽑기, G/Esc로 닫기
      const k = keyOf(e);
      if (!e.repeat && (k === 'fire' || e.key === 'Enter')) pullGacha();
      else if (!e.repeat && (isGachaKey || e.key === 'Escape')) closeGacha();
      e.preventDefault();
      return;
    }
    if (isShopKey && !e.repeat) { openMenu('forge'); e.preventDefault(); return; }
    if (isBagKey && !e.repeat) { openMenu('equip'); e.preventDefault(); return; }
    if (isDexKey && !e.repeat) { openMenu('dex'); e.preventDefault(); return; }
    if (isSkillKey) { if (!e.repeat) useSkill(); e.preventDefault(); return; }
    if (isGachaKey && !e.repeat) { openGacha(); e.preventDefault(); return; }
    const isDashKey = e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.key === 'Shift' ||
      e.code === 'KeyK' || e.key === 'k' || e.key === 'K' || e.key === 'ㅏ';
    if (isDashKey) { if (!e.repeat) tryDash(); e.preventDefault(); return; }
    const k = keyOf(e);
    if (k) { keys[k] = true; e.preventDefault(); }
  }, true);
  document.addEventListener('keyup', e => {
    const k = keyOf(e);
    if (k) { keys[k] = false; e.preventDefault(); }
  }, true);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // 키보드 포커스 확보 (미리보기 창 안에서 열려도 키 입력이 들어오도록)
  canvas.tabIndex = 0;
  canvas.style.outline = 'none';
  function grabFocus() {
    try { window.focus(); } catch (_) {}
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
  }
  grabFocus();
  window.addEventListener('load', grabFocus);
  document.addEventListener('pointerdown', grabFocus, true);
  document.addEventListener('mouseenter', grabFocus);

  // ===== 터치 조이스틱 (화면 아무 곳이나 누르고 끌기) =====
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, max: 50 };

  function stickStart(id, x, y) {
    stick.active = true;
    stick.id = id;
    stick.ox = x; stick.oy = y;
    stick.x = x; stick.y = y;
  }
  function stickMove(x, y) {
    stick.x = x; stick.y = y;
  }
  function stickEnd() {
    stick.active = false;
    stick.id = null;
  }

  // ===== 발사 버튼 (오른쪽 아래) =====
  const fireBtn = { r: 40, pressed: false, id: null };
  function fireBtnPos() {
    return { x: W - fireBtn.r - 28, y: H - fireBtn.r - 40 };
  }
  function onFireBtn(x, y) {
    const p = fireBtnPos();
    return Math.hypot(x - p.x, y - p.y) <= fireBtn.r + 14;
  }
  // ===== 대쉬 버튼 (발사 버튼 왼쪽 위) =====
  function dashBtnPos() {
    const p = fireBtnPos();
    return { x: p.x - 80, y: p.y - 64 };
  }
  function onDashBtn(x, y) {
    const p = dashBtnPos();
    return Math.hypot(x - p.x, y - p.y) <= DASH.btnR + 10;
  }

  canvas.addEventListener('pointerdown', e => {
    if (pick.open) {
      const rs = pickCardRects();
      for (let i = 0; i < rs.length; i++) {
        const r = rs[i];
        if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) {
          pick.sel = i; choosePick(i); break;
        }
      }
      e.preventDefault();
      return;
    }
    if (menu.open) {
      for (let i = menuHits.length - 1; i >= 0; i--) if (inRect(e.clientX, e.clientY, menuHits[i].r)) { menuHits[i].fn(); break; }
      e.preventDefault();
      return;
    }
    if (gacha.open) {
      const L = gachaLayout();
      if (inRect(e.clientX, e.clientY, L.drawBtn)) pullGacha();
      else if (inRect(e.clientX, e.clientY, L.closeBtn)) closeGacha();
      e.preventDefault();
      return;
    }
    for (let i = 0; i < HUD_BTNS.length; i++) {
      if (inRect(e.clientX, e.clientY, hudBtnRect(i))) { HUD_BTNS[i].act(); e.preventDefault(); return; }
    }
    if (onSkillBtn(e.clientX, e.clientY)) {
      useSkill();
      e.preventDefault();
      return;
    }
    if (onDashBtn(e.clientX, e.clientY)) {
      tryDash();
      e.preventDefault();
      return;
    }
    if (!fireBtn.pressed && onFireBtn(e.clientX, e.clientY)) {
      canvas.setPointerCapture(e.pointerId);
      fireBtn.pressed = true;
      fireBtn.id = e.pointerId;
      e.preventDefault();
      return;
    }
    if (stick.active) return;
    canvas.setPointerCapture(e.pointerId);
    stickStart(e.pointerId, e.clientX, e.clientY);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (stick.active && e.pointerId === stick.id) {
      stickMove(e.clientX, e.clientY);
      e.preventDefault();
    }
  });
  const endHandler = e => {
    if (stick.active && e.pointerId === stick.id) stickEnd();
    if (fireBtn.pressed && e.pointerId === fireBtn.id) { fireBtn.pressed = false; fireBtn.id = null; }
  };
  canvas.addEventListener('pointerup', endHandler);
  canvas.addEventListener('pointercancel', endHandler);

  function getInput() {
    let ix = 0, iy = 0;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;
    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;

    if (stick.active) {
      let dx = stick.x - stick.ox;
      let dy = stick.y - stick.oy;
      const d = Math.hypot(dx, dy);
      if (d > 8) {
        const m = Math.min(d, stick.max) / stick.max;
        ix += (dx / d) * m;
        iy += (dy / d) * m;
      }
    }

    const len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; }
    return { x: ix, y: iy };
  }

  // ===== 업데이트 =====
  function update(dt) {
    const inp = getInput();
    const mag = Math.hypot(inp.x, inp.y);
    player.moving = mag > 0.05;

    // 대쉬(회피): 미끄러지는 동안은 정해진 방향으로 빠르게 이동
    dash.cd = Math.max(0, dash.cd - dt);
    dash.inv = Math.max(0, dash.inv - dt);
    if (dash.t > 0) {
      const st = Math.min(dt, dash.t);
      player.x += dash.dx * DASH.speed * st;
      player.y += dash.dy * DASH.speed * st;
      dash.t -= dt;
      dash.ghostT -= dt;
      if (dash.ghostT <= 0) { dash.ghostT = 0.03; dashGhosts.push({ x: player.x, y: player.y, t: 0 }); }
    } else if (player.moving) {
      player.x += inp.x * player.speed * dt;
      player.y += inp.y * player.speed * dt;
      player.dirX = inp.x / mag;
      player.dirY = inp.y / mag;
      player.walkTime += dt * (6 + 6 * mag);
    } else {
      player.walkTime = 0;
    }
    for (let i = dashGhosts.length - 1; i >= 0; i--) {
      dashGhosts[i].t += dt;
      if (dashGhosts[i].t > 0.25) dashGhosts.splice(i, 1);
    }

    // 맞았을 때 밀려남 / 무적 시간
    player.x += player.kbx * dt; player.y += player.kby * dt;
    const kd = Math.exp(-dt * 12); player.kbx *= kd; player.kby *= kd;
    player.invuln = Math.max(0, player.invuln - dt);
    player.hurt = Math.max(0, player.hurt - dt);

    // 세계 경계
    player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
    player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));

    // 공격 (무기 공격 타입에 따라 투사체 · 산탄 · 레이저 · 파동)
    const firing = keys.fire || fireBtn.pressed;
    gun.cooldown = Math.max(firing ? -1 : 0, gun.cooldown - dt);
    gun.recoil = Math.max(0, gun.recoil - dt * 6);
    laser.on = firing && equip.weapon.def.kind === 'laser';
    for (let n = 0; firing && gun.cooldown <= 0 && n < 4; n++) {
      gun.cooldown += fireRate();
      fireWeapon();
    }
    // 스킬 쿨타임 / 집중 레이저 시간
    skill.cd = Math.max(0, skill.cd - dt);
    skill.focusT = Math.max(0, skill.focusT - dt);
    skill.fx = Math.max(0, skill.fx - dt * 3);
    weapon.fx = Math.max(0, weapon.fx - dt * 1.2);

    // 30초마다 강화 선택
    pick.t += dt;
    if (pick.t >= PICK.every) { pick.t -= PICK.every; openPick(); return; }

    // 출현: 1초마다 굴림
    spawner.t += dt;
    while (spawner.t >= 1) { spawner.t -= 1; spawnRoll(); }
    warn.t = Math.max(0, warn.t - dt);
    banner.t = Math.max(0, banner.t - dt);

    // 총알 이동 + 몬스터 명중
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.homing) {
        // 유도탄: 가까운 몬스터 쪽으로 방향을 틈
        let best = null, bd = 380;
        for (const m of monsters) {
          if (b.hits && b.hits.includes(m)) continue;
          const d = Math.hypot(m.x - b.x, m.y - b.y);
          if (d < bd) { bd = d; best = m; }
        }
        if (best) {
          let cur = Math.atan2(b.vy, b.vx);
          const want = Math.atan2(best.y - b.y, best.x - b.x);
          const diff = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          const turn = 10 * dt;
          cur += Math.max(-turn, Math.min(turn, diff));
          b.vx = Math.cos(cur) * b.spd; b.vy = Math.sin(cur) * b.spd;
        }
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WORLD.w || b.y > WORLD.h;
      if (!dead) {
        for (let j = monsters.length - 1; j >= 0; j--) {
          const m = monsters[j];
          if (b.hits && b.hits.includes(m)) continue;   // 관통탄: 이미 뚫은 몬스터는 건너뜀
          if (Math.hypot(b.x - m.x, b.y - m.y) < m.r + 4) {
            damageMonster(m, b.dmg, b.vx / b.spd * 6, b.vy / b.spd * 6);
            if (b.stunShot && !m.dead) stunMonster(m, 2);   // 스턴탄
            if (b.pierce > 0) { b.pierce--; b.hits.push(m); }
            else dead = true;
            break;
          }
        }
      }
      if (dead) bullets.splice(i, 1);
    }

    // 잭팟: 회전 칼날
    if (pick.bladeN > 0) {
      pick.bladeA += dt * BLADE.spin;
      for (const m of monsters.slice()) {
        m.bladeCd = Math.max(0, (m.bladeCd || 0) - dt);
        if (m.bladeCd > 0) continue;
        for (let k = 0; k < pick.bladeN; k++) {
          const a = pick.bladeA + k * Math.PI * 2 / pick.bladeN;
          const bx = player.x + Math.cos(a) * BLADE.orbit, by = player.y + Math.sin(a) * BLADE.orbit;
          if (Math.hypot(m.x - bx, m.y - by) < m.r + BLADE.r) {
            m.bladeCd = BLADE.cd;
            const dx = m.x - player.x, dy = m.y - player.y, d = Math.hypot(dx, dy) || 1;
            damageMonster(m, playerDmg(), dx / d * 6, dy / d * 6);
            break;
          }
        }
      }
    }
    // 잭팟: 번개 (일정 시간마다 가까운 적 여러 마리)
    if (pick.boltN > 0) {
      pick.boltT -= dt;
      if (pick.boltT <= 0) {
        const near = monsters
          .map(m => ({ m, d: Math.hypot(m.x - player.x, m.y - player.y) }))
          .filter(o => o.d < BOLT.range)
          .sort((a, b) => a.d - b.d)
          .slice(0, boltTargets());
        if (near.length) {
          pick.boltT = BOLT.every;
          for (const { m } of near) {
            const pts = [{ x: player.x, y: player.y }];
            for (let k = 1; k < 6; k++) {
              const f = k / 6, nx = -(m.y - player.y), ny = m.x - player.x, nl = Math.hypot(nx, ny) || 1;
              const off = (Math.random() - 0.5) * 34;
              pts.push({ x: player.x + (m.x - player.x) * f + nx / nl * off, y: player.y + (m.y - player.y) * f + ny / nl * off });
            }
            pts.push({ x: m.x, y: m.y });
            bolts.push({ pts, t: 0 });
            damageMonster(m, playerDmg() * BOLT.mul, 0, 0);
          }
        } else pick.boltT = 0.2;
      }
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
      bolts[i].t += dt;
      if (bolts[i].t > 0.25) bolts.splice(i, 1);
    }
    // 체력 재생
    if (pick.regenN > 0) {
      pick.regenT += dt;
      const ev = regenEvery(pick.regenN);
      if (pick.regenT >= ev) {
        pick.regenT -= ev;
        if (player.hp < player.maxHp) {
          player.hp = Math.min(player.maxHp, player.hp + PICK.regenAmt);
          floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '+' + PICK.regenAmt, color: '90,220,190' });
        }
      }
    }

    // 몬스터 돌아다니기

    }

    for (const m of monsters) {
      m.t += dt;
      m.hit = Math.max(0, m.hit - dt);
      m.atkCd = Math.max(0, m.atkCd - dt);
      if (m.slamFx) m.slamFx = Math.max(0, m.slamFx - dt * 2.5);

      const pd = Math.hypot(pdx, pdy);

      if (busy) m.stun = Math.max(0, m.stun - dt);
      if (!busy && (m.boss || m.final)) {

          m.y += m.vy * m.speed * dt;

            m.vx = Math.cos(a); m.vy = Math.sin(a);

          m.x += m.vx * m.speed * dt;
          m.y += m.vy * m.speed * dt;

      }

      if (m.y < m.r || m.y > WORLD.h - m.r) { m.vy *= -1; m.y = Math.max(m.r, Math.min(WORLD.h - m.r, m.y)); }

      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      let gone = s.life <= 0 || s.x < 0 || s.y < 0 || s.x > WORLD.w || s.y > WORLD.h;
      if (!gone && Math.hypot(s.x - player.x, s.y - player.y) < s.r + player.r) {

      if (p.t > 0.3 && Math.hypot((player.x - p.x) / p.r, (player.y - p.y) / (p.r * 0.7)) < 1) hurtPlayer(p.dmg, p.x, p.y);

    // 도감: 화면에 들어온 적은 '만남' → 정보 공개
    for (const m of monsters) {

      if (!e.seen && Math.abs(m.x - player.x) < W / 2 + m.r && Math.abs(m.y - player.y) < H / 2 + m.r) e.seen = true;
    }

    // 아이템 먹기 (닿으면 먹음)
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.t += dt;
      if (pick.magnetN > 0) {
        const dx = player.x - it.x, dy = player.y - it.y, d = Math.hypot(dx, dy);
        if (d < magnetRange() + player.r && d > 0) {
          const mv = Math.min(d, 520 * dt);

        }
      }
      if (Math.hypot(it.x - player.x, it.y - player.y) < player.r + it.r) {

    }

    for (let i = loots.length - 1; i >= 0; i--) {
      const c = loots[i];
      c.t += dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      const fr = Math.exp(-dt * 5); c.vx *= fr; c.vy *= fr;
      c.x = Math.max(LOOT.r, Math.min(WORLD.w - LOOT.r, c.x));
      c.y = Math.max(LOOT.r, Math.min(WORLD.h - LOOT.r, c.y));
      if (c.t < 0.3) continue;
      if (pick.magnetN > 0) {
        const dx = player.x - c.x, dy = player.y - c.y, d = Math.hypot(dx, dy);
        if (d < magnetRange() + player.r && d > 0) {
          const mv = Math.min(d, 520 * dt);
          c.x += dx / d * mv; c.y += dy / d * mv;
        }
      }

        collectLoot(c, player.x, player.y);
      }
    }
    // 강아지 코코

    wallet.fx = Math.max(0, wallet.fx - dt * 3);
    // 포탈에 들어가면 다음 스테이지
    if (portal) {

    // 카메라: 캐릭터를 화면 가운데에
    cam.x = Math.round(player.x - W / 2);
    cam.y = Math.round(player.y - H / 2);
  }

  // ===== 바닥 (픽셀 타일 — 테마마다 세계 전체 바닥을 1칸 16px로 한 장 구워 두고 ×3으로 그림) =====
  const floorCv = {};

      const v = tileHash(tx, ty) < 0.08 ? 5 : Math.floor(tileHash(ty + 7.3, tx + 3.1) * 5);

    if (th.lava) {

      for (let ty = Math.max(0, ty0); ty <= Math.min(TILES - 1, ty1); ty++)
        for (let tx = Math.max(0, tx0); tx <= Math.min(TILES - 1, tx1); tx++) {

    if (m.stun > 0) {

  function drawCorpses() {
    for (const c of corpses) {

  // 이름(등급 색) + 체력바 — 보스는 늘 큰 체력바

  // ===== 바닥 아이템 =====
  function drawItems() {
    for (const it of items) {
      const sx = it.x - cam.x, sy = it.y - cam.y;
      if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
      const pop = Math.min(1, it.t / 0.2);
      if (pop <= 0) continue;
      const bob = Math.round(Math.sin(it.t * 4) * 3);
      ctx.fillStyle = `rgba(255,120,70,${0.22 + 0.1 * Math.sin(it.t * 6)})`;
      ctx.beginPath(); ctx.arc(sx, sy - 4 + bob, it.r * 1.9 * pop, 0, Math.PI * 2); ctx.fill();
      drawPxC(iconCv('orb'), sx, sy - 4 + bob, pop < 1 ? 1 : 2);
    }
  }
  function drawCoinIcon(x, y, r) { drawPxC(iconCv('gold'), x, y, r >= 12 ? 2 : 1); }
  function drawLoots() {
    for (const l of loots) {
      const sx = Math.round(l.x - cam.x), sy = Math.round(l.y - cam.y);
      if (sx < -30 || sy < -30 || sx > W + 30 || sy > H + 30) continue;
      const y = sy - 4 + Math.round(Math.sin(l.t * 5 + l.ph) * 2);
      ctx.fillStyle = 'rgba(16,14,24,0.85)'; ctx.fillRect(sx - 18, y - 18, 36, 36);
      ctx.strokeStyle = gradeColor(l.grade); ctx.lineWidth = 3; ctx.strokeRect(sx - 16.5, y - 16.5, 33, 33);

  }
  // 아이콘 칸 (등급 색 테두리) — 메뉴에서 씀
  function iconBox(name, gi, x, y, size, sel) {
    ctx.fillStyle = sel ? 'rgba(255,214,90,0.25)' : 'rgba(20,22,30,0.95)';
    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = gi >= 0 ? gradeColor(gi) : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = sel ? 3 : 2;
    ctx.strokeRect(x + 1, y + 1, size - 2, size - 2);
    if (sel) { ctx.strokeStyle = '#ffd65a'; ctx.lineWidth = 2; ctx.strokeRect(x - 2, y - 2, size + 4, size + 4); }
    if (name) drawPxC(iconCv(name, gi), x + size / 2, y + size / 2, Math.max(1, Math.floor((size - 6) / 16)));
  }

  // ===== 레이저 · 파동 · 충격파 · 독장판 =====
  function drawLaser() {
    if (!laser.on) return;
    const wd = equip.weapon.def, f = skill.focusT > 0, now = performance.now();
    ctx.lineCap = 'butt';
    for (const b of laserBeams()) {
      const x0 = b.x0 - cam.x, y0 = b.y0 - cam.y, x1 = b.x1 - cam.x, y1 = b.y1 - cam.y;
      for (const [w, c] of [[LASER.width * (f ? 1.9 : 1.3) + Math.sin(now / 30) * 2, `rgba(${wd.color},0.3)`], [LASER.width * (f ? 1 : 0.6), `rgb(${wd.color})`], [3, 'rgba(255,255,255,0.95)']]) {
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }
  }
  function drawRings(list, dur) {
    for (const w of list) {
      const k = Math.min(1, w.t / dur), R = w.r * (0.2 + 0.8 * k);
      ctx.strokeStyle = `rgba(${w.color},${1 - k})`; ctx.lineWidth = 8 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(w.x - cam.x, w.y - cam.y, R, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(${w.color},${0.12 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(w.x - cam.x, w.y - cam.y, R, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawPools() {
    const now = performance.now() / 1000;
    for (const p of pools) {
      const sx = p.x - cam.x, sy = p.y - cam.y;
      if (sx < -100 || sy < -100 || sx > W + 100 || sy > H + 100) continue;
      const a = Math.min(1, p.t / 0.3, (p.life - p.t) / 0.5);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(140,200,70,0.38)';
      ctx.beginPath(); ctx.ellipse(sx, sy, p.r, p.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PAL.v; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.ellipse(sx, sy, p.r, p.r * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = PAL.p;
      for (let i = 0; i < 5; i++) {
        const ph = (now * 0.8 + i * 0.37) % 1, bx = sx + Math.cos(i * 2.4) * p.r * 0.55, by = sy + Math.sin(i * 2.4) * p.r * 0.35 - ph * 14;
        ctx.fillRect(Math.round(bx), Math.round(by), PX * 2, PX * 2);
      }
      ctx.globalAlpha = 1;
    }
  }
  // 보스 등장 경고: 화면 가장자리 붉은 번쩍임 + 화면 밖 보스 방향 화살표
  function drawWarn() {
    const now = performance.now() / 1000;
    if (warn.t > 0) {
      const a = (0.25 + 0.25 * Math.sin(now * 12)) * Math.min(1, warn.t);
      const E = 46;
      let g = ctx.createLinearGradient(0, 0, 0, E); g.addColorStop(0, `rgba(255,30,30,${a})`); g.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, E);
      g = ctx.createLinearGradient(0, H, 0, H - E); g.addColorStop(0, `rgba(255,30,30,${a})`); g.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = g; ctx.fillRect(0, H - E, W, E);
      g = ctx.createLinearGradient(0, 0, E, 0); g.addColorStop(0, `rgba(255,30,30,${a})`); g.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, E, H);
      g = ctx.createLinearGradient(W, 0, W - E, 0); g.addColorStop(0, `rgba(255,30,30,${a})`); g.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = g; ctx.fillRect(W - E, 0, E, H);
    }
    const b = monsters.find(m => m.def.boss);
    if (!b) return;
    const sx = b.x - cam.x, sy = b.y - cam.y;
    if (sx > -10 && sy > -10 && sx < W + 10 && sy < H + 10) return;
    const a = Math.atan2(b.y - player.y, b.x - player.x), ca = Math.cos(a), sa = Math.sin(a), mg = 48;
    const t = Math.min((W / 2 - mg) / Math.max(1e-6, Math.abs(ca)), (H / 2 - mg) / Math.max(1e-6, Math.abs(sa)));
    const ax = W / 2 + ca * t, ay = H / 2 + sa * t, gc = gradeColor(b.def.grade);
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(a);
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(now * 6);
    ctx.fillStyle = gc; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -13); ctx.lineTo(-4, 0); ctx.lineTo(-10, 13); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(b.def.name, ax - ca * 30, ay - sa * 30);
    ctx.fillStyle = gc; ctx.fillText(b.def.name, ax - ca * 30, ay - sa * 30);
  }

  // ===== 스킬 버튼 (발사 버튼 위, Epic 이상 무기를 들었을 때만) =====
  const SKILL_BTN = { r: 28 };
  function skillBtnPos() { const p = fireBtnPos(); return { x: p.x, y: p.y - fireBtn.r - SKILL_BTN.r - 16 }; }
  function onSkillBtn(x, y) { if (!curSkill()) return false; const p = skillBtnPos(); return Math.hypot(x - p.x, y - p.y) <= SKILL_BTN.r + 8; }
  function drawSkillBtn() {
    const sk = curSkill();
    if (!sk || pick.open || menu.open || gacha.open) return;
    const p = skillBtnPos(), r = SKILL_BTN.r, ready = skill.cd <= 0;
    const down = skill.fx > 0.7 ? BTN_DEPTH - 1 : 0, cy = p.y + down;
    roundBtnBase(p.x, p.y, r, down, ready ? 'rgba(80,30,120,0.65)' : 'rgba(25,30,40,0.6)');
    ctx.save();
    ctx.translate(p.x, cy);
    ctx.fillStyle = ready ? btnGrad('skill', r, 'rgba(210,150,255,0.6)', 'rgba(140,70,220,0.45)') : btnGrad('skillCd', r, 'rgba(90,100,115,0.5)', 'rgba(50,58,70,0.45)');
    ctx.strokeStyle = ready ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    btnShine(r);
    ctx.restore();
    if (!ready) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.moveTo(p.x, cy);
      ctx.arc(p.x, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (skill.cd / sk.cd));
      ctx.closePath(); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitText(sk.name, r * 2 - 6, 11, true);
    ctx.fillStyle = ready ? '#ffffff' : 'rgba(255,255,255,0.6)';
    ctx.fillText(sk.name, p.x, cy - 3);
    ctx.font = 'bold 10px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(ready ? '스킬 Q' : Math.ceil(skill.cd) + '초', p.x, cy + 10);

  // 모든 그림자를 바닥에 먼저 그림 (캐릭터·몬스터보다 아래에 깔림)
  function drawShadows() {
    for (const it of items) {
      const sx = it.x - cam.x, sy = it.y - cam.y;
      if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
      const pop = Math.min(1, it.t / 0.2), bob = Math.sin(it.t * 4) * 3, r = it.r * pop;
      const k = 1.08 - (4 - bob) * 0.03;   // 높이 뜰수록 그림자가 작아짐
      shadowAt(sx + 2, sy + it.r * 0.9, r * 0.9 * k, r * 0.4 * k, 0.24);
    }
    for (const c of loots) {
      const sx = c.x - cam.x, sy = c.y - cam.y;
      if (sx < -30 || sy < -30 || sx > W + 30 || sy > H + 30) continue;
      shadowAt(sx + 2, sy + 16, 14, 4, 0.22);
    }
    for (const m of monsters) {
      const sx = m.x - cam.x, sy = m.y - cam.y, cull = m.r + 60;
      if (sx < -cull || sy < -cull || sx > W + cull || sy > H + cull) continue;
      shadowAt(sx + m.r * 0.15, sy + m.r * 0.7, m.r, m.r * 0.45, 0.22);
    }
    {
      const sx = player.x - cam.x, sy = player.y - cam.y;
      shadowAt(sx + player.r * 0.15, sy + player.r * 0.7, player.r * 0.95, player.r * 0.45, 0.24);
    }
    {
      // 강아지 코코 (폴짝 뛰면 그림자가 작아짐)
      const sx = pet.x - cam.x, sy = pet.y - cam.y, k = pet.happy > 0 ? 0.8 : 1;
      shadowAt(sx + PET.r * 0.15, sy + PET.r * 0.7, PET.r * 0.95 * k, PET.r * 0.45 * k, 0.22);
    }
    // 공중에 떠 있는 것 (총알 · 보스 탄 · 회전 칼날) — 바닥에 옅은 그림자
    if (bullets.length) {
      const lw = 4 + Math.min(power.level, 8);
      ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = lw * 0.8; ctx.lineCap = 'round';
      ctx.beginPath();
      for (const b of bullets) {
        const sx = b.x - cam.x + 3, sy = b.y - cam.y + 11;
        ctx.moveTo(sx, sy); ctx.lineTo(sx - b.vx * 0.015, sy - b.vy * 0.015);
      }
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
    if (enemyShots.length) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      for (const s of enemyShots) {
        const sx = s.x - cam.x + 3, sy = s.y - cam.y + s.r + 9;
        if (sx < -30 || sy < -30 || sx > W + 30 || sy > H + 30) continue;
        ctx.moveTo(sx + s.r * 0.9, sy);
        ctx.ellipse(sx, sy, s.r * 0.9, s.r * 0.38, 0, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    if (pick.bladeN > 0) {
      const px = player.x - cam.x, py = player.y - cam.y;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      for (let k = 0; k < pick.bladeN; k++) {
        const a = pick.bladeA + k * Math.PI * 2 / pick.bladeN;
        const bx = px + Math.cos(a) * BLADE.orbit + 3, by = py + Math.sin(a) * BLADE.orbit + 15;
        ctx.moveTo(bx + 11, by);
        ctx.ellipse(bx, by, 11, 4.5, 0, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }

  // 몬스터와 캐릭터를 아래쪽에 있는 것이 앞에 오도록 순서대로 그림
  const actors = [];
  function drawActors() {
    actors.length = 0;
    for (const m of monsters) {
      const sx = m.x - cam.x, sy = m.y - cam.y, cull = m.r + 60;
      if (sx < -cull || sy < -cull || sx > W + cull || sy > H + cull) continue;
      actors.push(m);
    }
    actors.push(player);
    actors.push(pet);
    actors.sort((a, b) => (a.y + a.r) - (b.y + b.r));
    for (const a of actors) {
      if (a === player) drawPlayer();
      else if (a === pet) drawPet();
      else drawMonsterBody(a);
    }
  }

  // 코코 이름표 + 처음 인사 말풍선 (몬스터에 가려지지 않게 따로 그림)
  function drawPetTag() {

    ctx.beginPath(); ctx.moveTo(sx - 6, bt + bh - 1); ctx.lineTo(sx, bt + bh + 7); ctx.lineTo(sx + 6, bt + bh - 1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 6, bt + bh); ctx.lineTo(sx, bt + bh + 7); ctx.lineTo(sx + 6, bt + bh); ctx.stroke();
    ctx.fillStyle = '#4a3418';
    ctx.fillText(pet.say, sx, bt + bh / 2 + 1);
