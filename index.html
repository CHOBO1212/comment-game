  }

  function drawBossTelegraphs() {
    for (const m of monsters) {
      if (!m.boss && !m.final) continue;
      const B = m.final ? FINAL : BOSS;
      const sx = m.x - cam.x, sy = m.y - cam.y;
      if (sx < -400 || sy < -400 || sx > W + 400 || sy > H + 400) continue;
      ctx.save();
      if (m.pat === 'slam' && m.pt < PAT.slamWind) {
        const k = m.pt / PAT.slamWind;
        ctx.fillStyle = 'rgba(255,60,50,0.12)';
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,50,0.3)';
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR * k, 0, Math.PI * 2); ctx.fill();
        ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,80,70,0.9)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR, 0, Math.PI * 2); ctx.stroke();
      } else if (m.pat === 'charge' && m.pt < PAT.chargeWind) {
        const len = B.chargeSpeed * PAT.chargeDur;
        ctx.translate(sx, sy); ctx.rotate(m.aim);
        ctx.fillStyle = `rgba(255,60,50,${0.15 + 0.2 * (m.pt / PAT.chargeWind)})`;
        ctx.fillRect(0, -m.r, len, m.r * 2);
        ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,80,70,0.9)'; ctx.lineWidth = 2;
        ctx.strokeRect(0, -m.r, len, m.r * 2);
      } else if (m.pat === 'fan' && m.fired === 0) {
        ctx.strokeStyle = `rgba(${B.shotColor},0.55)`; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        for (let s = 0; s < B.fanShots; s++) {
          const a = m.aim + (s - (B.fanShots - 1) / 2) * B.fanSpread;
          ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * m.r, sy + Math.sin(a) * m.r);
          ctx.lineTo(sx + Math.cos(a) * (m.r + 160), sy + Math.sin(a) * (m.r + 160)); ctx.stroke();
        }
      } else if (m.pat === 'ring' && m.fired === 0) {
        const k = m.pt / PAT.ringWind;
        ctx.strokeStyle = `rgba(${B.shotColor},${0.4 + 0.5 * k})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(sx, sy, m.r + 30 - k * 22, 0, Math.PI * 2); ctx.stroke();
      }
      if (m.slamFx > 0) {
        ctx.setLineDash([]);
        ctx.strokeStyle = `rgba(255,200,120,${m.slamFx})`; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR * (1.05 - m.slamFx * 0.3), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawBlades() {
    if (pick.bladeN <= 0) return;
    const px = player.x - cam.x, py = player.y - cam.y;
    ctx.strokeStyle = 'rgba(255,214,90,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, BLADE.orbit, 0, Math.PI * 2); ctx.stroke();
    const star = () => {
      ctx.beginPath();
      for (let q = 0; q < 8; q++) {
        const rr = q % 2 === 0 ? BLADE.r + 2 : 4.5;
        const qa = q * Math.PI / 4;
        if (q === 0) ctx.moveTo(Math.cos(qa) * rr, Math.sin(qa) * rr); else ctx.lineTo(Math.cos(qa) * rr, Math.sin(qa) * rr);
      }
      ctx.closePath();
    };
    for (let k = 0; k < pick.bladeN; k++) {
      const a = pick.bladeA + k * Math.PI * 2 / pick.bladeN;
      const bx = px + Math.cos(a) * BLADE.orbit, by = py + Math.sin(a) * BLADE.orbit;
      const rot = pick.bladeA * 3 + k;
      // 칼날 두께 (아래로 보이는 옆면)
      ctx.save();
      ctx.translate(bx, by + 2.5);
      ctx.rotate(rot);
      ctx.fillStyle = '#7a5a10';
      star(); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(bx, by);
      ctx.fillStyle = 'rgba(255,214,90,0.25)';
      ctx.beginPath(); ctx.arc(0, 0, BLADE.r + 5, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(rot);
      // 금속 광택: 가운데는 밝고 끝으로 갈수록 어두운 은색
      ctx.fillStyle = cached('blade', () => {
        const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, BLADE.r + 3);
        g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e6eaf0'); g.addColorStop(1, '#9aa2ae');
        return g;
      });
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
      star(); ctx.fill(); ctx.stroke();
      ctx.restore();
      drawBall(bx, by, 3, '#ffd24a');
    }
  }

  function drawBolts() {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const b of bolts) {
      const a = 1 - b.t / 0.25;
      for (const [w, c] of [[9, `rgba(140,180,255,${0.35 * a})`], [3.5, `rgba(220,235,255,${a})`]]) {
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath();
        b.pts.forEach((p, i) => { const x = p.x - cam.x, y = p.y - cam.y; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
        ctx.stroke();
      }
      const e = b.pts[b.pts.length - 1];
      ctx.fillStyle = `rgba(200,225,255,${0.6 * a})`;
      ctx.beginPath(); ctx.arc(e.x - cam.x, e.y - cam.y, 16 * a + 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  }

  function drawEnemyShots() {
    for (const s of enemyShots) {
      const sx = s.x - cam.x, sy = s.y - cam.y;
      if (sx < -30 || sy < -30 || sx > W + 30 || sy > H + 30) continue;
      if (s.arrow) {
        // 고블린 궁수의 화살 (픽셀)
        ctx.save();
        ctx.translate(Math.round(sx), Math.round(sy)); ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.fillStyle = PAL.k; ctx.fillRect(-17, -3, 24, 6);
        ctx.fillStyle = PAL.B; ctx.fillRect(-15, -1.5, 16, 3);
        ctx.fillStyle = PAL.l; ctx.fillRect(0, -3, 6, 6);
        ctx.fillStyle = PAL.w; ctx.fillRect(-17, -4, 5, 2); ctx.fillRect(-17, 2, 5, 2);
        ctx.restore();
        continue;
      }
      ctx.fillStyle = `rgba(${s.color},0.3)`;
      ctx.beginPath(); ctx.arc(sx, sy, s.r * 1.8, 0, Math.PI * 2); ctx.fill();
      // 빛나는 구슬 (입체 공 + 하얀 심지)
      ctx.save();
      ctx.translate(sx, sy);
      ctx.fillStyle = ballGrad(s.color, s.r);
      ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(-s.r * 0.12, -s.r * 0.12, s.r * 0.38, 0, Math.PI * 2); ctx.fill();
      specular(s.r, 0.8);
      ctx.restore();
    }
  }

  function drawBanner() {
    if (banner.t <= 0) return;
    const a = Math.min(1, banner.t / 0.5);
    ctx.font = 'bold 26px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = safeTop + 236;   // 오른쪽 위 버튼 4개 아래
    ctx.lineWidth = 6; ctx.strokeStyle = `rgba(0,0,0,${0.75 * a})`;
    ctx.strokeText(banner.text, W / 2, y);
    ctx.fillStyle = `rgba(${banner.color},${a})`;
    ctx.fillText(banner.text, W / 2, y);
  }

  function drawHitboxes() {
    for (const m of monsters) {
      if (m.state === 'aim' || m.state === 'cast' || m.state === 'cwind') { drawRangedTele(m); continue; }
      if (m.state !== 'windup' && m.state !== 'attack') continue;
      const hb = hitboxOf(m);
      const sx = hb.x - cam.x, sy = hb.y - cam.y;
      if (sx < -80 || sy < -80 || sx > W + 80 || sy > H + 80) continue;
      ctx.save();
      if (m.state === 'windup') {
        const k = m.st / ATK.windup;
        // 예고: 점선 테두리 + 안쪽이 점점 차오름
        ctx.fillStyle = 'rgba(255,60,50,0.12)';
        ctx.beginPath(); ctx.arc(sx, sy, hb.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,50,0.35)';
        ctx.beginPath(); ctx.arc(sx, sy, hb.r * k, 0, Math.PI * 2); ctx.fill();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = 'rgba(255,80,70,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, hb.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        // 판정 중: 진한 빨강
        ctx.fillStyle = 'rgba(255,40,30,0.6)';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sx, sy, hb.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 원거리·장판·돌진 예고 (빨간 점선)
  function drawRangedTele(m) {
    const sx = m.x - cam.x, sy = m.y - cam.y;
    if (sx < -400 || sy < -400 || sx > W + 400 || sy > H + 400) return;
    ctx.save();
    if (m.state === 'aim') {
      ctx.strokeStyle = `rgba(255,80,70,${0.35 + 0.5 * (m.st / ARROW.wind)})`; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(player.x - cam.x, player.y - cam.y); ctx.stroke();
    } else if (m.state === 'cast') {
      const k = m.st / POOL.wind, R = POOL.r * TILE, tx = m.tx - cam.x, ty = m.ty - cam.y;
      ctx.fillStyle = 'rgba(160,90,220,0.15)';
      ctx.beginPath(); ctx.ellipse(tx, ty, R, R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(160,90,220,0.35)';
      ctx.beginPath(); ctx.ellipse(tx, ty, R * k, R * 0.7 * k, 0, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(200,120,255,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(tx, ty, R, R * 0.7, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (m.state === 'cwind') {
      const len = CHARGE.speed * TILE * CHARGE.dur;
      ctx.translate(sx, sy); ctx.rotate(m.aim);
      ctx.fillStyle = `rgba(255,60,50,${0.15 + 0.2 * (m.st / CHARGE.wind)})`;
      ctx.fillRect(0, -m.r, len, m.r * 2);
      ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,80,70,0.9)'; ctx.lineWidth = 2;
      ctx.strokeRect(0, -m.r, len, m.r * 2);
    }
    ctx.restore();
  }

  function drawPoofs() {
    for (const p of poofs) {
      const k = p.t / 0.4;
      ctx.strokeStyle = `rgba(200,160,230,${1 - k})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x - cam.x, p.y - cam.y, 10 + k * 26, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPortal() {
    if (!portal) return;
    const sx = portal.x - cam.x, sy = portal.y - cam.y, now = performance.now() / 1000;
    if (sx > -90 && sy > -90 && sx < W + 90 && sy < H + 90) {
      const R = portal.r * Math.min(1, portal.t / 0.8);
      ctx.fillStyle = `rgba(120,200,255,${0.18 + 0.08 * Math.sin(now * 4)})`;
      ctx.beginPath(); ctx.ellipse(sx, sy, R * 1.7, R * 1.3, 0, 0, Math.PI * 2); ctx.fill();
      // 솟은 테두리: 왼쪽 위는 빛, 오른쪽 아래는 그늘
      ctx.fillStyle = 'rgba(200,235,255,0.55)';
      ctx.beginPath(); ctx.ellipse(sx - 1.5, sy - 2, R + 5, (R + 5) * 0.75, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0c0820';
      ctx.beginPath(); ctx.ellipse(sx + 1.5, sy + 2, R + 5, (R + 5) * 0.75, 0, 0, Math.PI * 2); ctx.fill();
      // 깊은 구멍 (가운데로 갈수록 어두움)
      ctx.save();
      ctx.beginPath(); ctx.ellipse(sx, sy, R, R * 0.75, 0, 0, Math.PI * 2); ctx.clip();
      const pg = ctx.createRadialGradient(sx + R * 0.1, sy + R * 0.1, 1, sx, sy, R + 1);
      pg.addColorStop(0, '#020108'); pg.addColorStop(0.6, '#140c30'); pg.addColorStop(1, '#3a2470');
      ctx.fillStyle = pg;
      ctx.fillRect(sx - R - 2, sy - R - 2, R * 2 + 4, R * 2 + 4);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.rect(sx - R - 20, sy - R - 20, R * 2 + 40, R * 2 + 40);
      ctx.ellipse(sx + 3, sy + 4, R, R * 0.75, 0, 0, Math.PI * 2);
      ctx.fill('evenodd');
      ctx.restore();
      ctx.save();
      ctx.translate(sx, sy); ctx.scale(1, 0.75);
      ctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = k === 1 ? 'rgba(200,140,255,0.9)' : 'rgba(120,220,255,0.9)';
        ctx.lineWidth = 3;
        const a0 = now * (2 + k) + k * 2;
        ctx.beginPath(); ctx.arc(0, 0, R * (0.3 + k * 0.22), a0, a0 + Math.PI * 1.2); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = 'rgba(180,230,255,0.95)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(sx, sy, R, R * 0.75, 0, 0, Math.PI * 2); ctx.stroke();
      const label = '다음 스테이지 ▶';
      ctx.font = 'bold 14px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(label, sx, sy - R - 18);
      ctx.fillStyle = '#9fe0ff';
      ctx.fillText(label, sx, sy - R - 18);
    }
  }

  // 포탈이 화면 밖에 있으면 가장자리에 방향 화살표 (어두운 가장자리 위에 그림)
  function drawPortalArrow() {
    if (!portal) return;
    const sx = portal.x - cam.x, sy = portal.y - cam.y, now = performance.now() / 1000;
    if (sx < 20 || sy < 20 || sx > W - 20 || sy > H - 20) {
      const a = Math.atan2(portal.y - player.y, portal.x - player.x);
      const ca = Math.cos(a), sa = Math.sin(a), m = 40;
      const t = Math.min((W / 2 - m) / Math.max(1e-6, Math.abs(ca)), (H / 2 - m) / Math.max(1e-6, Math.abs(sa)));
      const ax = W / 2 + ca * t, ay = H / 2 + sa * t;
      ctx.save();
      ctx.translate(ax, ay); ctx.rotate(a);
      ctx.fillStyle = `rgba(150,220,255,${0.75 + 0.25 * Math.sin(now * 6)})`;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText('포탈', ax - ca * 26, ay - sa * 26);
      ctx.fillStyle = '#9fe0ff';
      ctx.fillText('포탈', ax - ca * 26, ay - sa * 26);
    }
  }


  // ===== 메뉴: 장비 · 대장간(강화/제작) · 적 도감 — 열려 있는 동안 게임은 멈춤 =====
  const MENU_TABS = [{ key: 'equip', name: '장비', hot: 'I' }, { key: 'forge', name: '대장간', hot: 'E' }, { key: 'dex', name: '도감', hot: 'B' }];
  const ENH_SLOTS = [{ key: 'weapon', name: '무기' }, { key: 'helmet', name: '투구' }, { key: 'armor', name: '갑옷' }, { key: 'pants', name: '바지' }];
  const menu = { open: false, tab: 'equip', sub: 'enh', openT: 0, sel: 0, page: 0, perPage: 18, cols: 6, enh: 0, cs: 0, cg: 0, dexSel: 0,
    msg: '', msgColor: '255,255,255', msgT: 0, fx: 0, shake: 0 };
  let menuHits = [];
  function menuHit(r, fn) { menuHits.push({ r, fn }); }
  function openMenu(tab) {
    if (pick.open || gacha.open || trans.active) return;
    menu.open = true; menu.tab = tab; menu.openT = 0; menu.msgT = 0;
    for (const k in keys) keys[k] = false;
    stickEnd();
    fireBtn.pressed = false; fireBtn.id = null;
    laser.on = false;
  }
  function closeMenu() { menu.open = false; }
  function menuMsg(text, color) { menu.msg = text; menu.msgColor = color || '255,255,255'; menu.msgT = 1.8; }
  function updateMenuUi(dt) {
    menu.openT += dt;
    menu.msgT = Math.max(0, menu.msgT - dt);
    menu.fx = Math.max(0, menu.fx - dt * 2.5);
    menu.shake = Math.max(0, menu.shake - dt * 3);
  }
  function bagItems() { return inv.weapons.concat(inv.armors, inv.accs); }
  const fmtG = n => Math.round(n).toLocaleString('ko-KR');

  // ----- 강화 -----
  function enhItem(i) { return equip[ENH_SLOTS[i].key]; }
  function canEnhance(it) { return it && it.lv < ENH_MAX && wallet.gold >= enhanceCost(itemGrade(it), it.lv + 1); }
  function doEnhance() {
    const it = enhItem(menu.enh);
    if (!it) { menuMsg('이 칸에 장착한 방어구가 없어요', '255,200,120'); menu.shake = 1; return; }
    if (it.lv >= ENH_MAX) { menuMsg('이미 최대 강화예요 (+10)', '255,200,120'); menu.shake = 1; return; }
    const cost = enhanceCost(itemGrade(it), it.lv + 1);
    if (wallet.gold < cost) { menuMsg('골드가 부족해요 (' + fmtG(cost - wallet.gold) + 'G 더 필요)', '255,110,100'); menu.shake = 1; return; }
    wallet.gold -= cost;
    it.lv++;   // 강화는 항상 성공
    menu.fx = 1;
    recalcStats();
    menuMsg('강화 성공! ' + itemName(it) + ' +' + it.lv, '120,230,140');
  }
  // ----- 제작 -----
  function craftCheck(si, gi) {
    const need = RECIPES[gi][si], gold = CRAFT_GOLD[gi], lack = [];
    for (const k in need) if (inv.mats[k] < need[k]) lack.push(k);
    const heartOk = gi < 5 || ((need.heart || 0) >= 1 && inv.mats.heart >= 1);   // Mythic 방어구는 군주의 심장이 꼭 1개 이상
    const goldOk = wallet.gold >= gold;
    return { need, gold, lack, goldOk, heartOk, ok: !lack.length && goldOk && heartOk };
  }
  function doCraft() {
    const si = menu.cs, gi = menu.cg, c = craftCheck(si, gi);
    if (!c.ok) { menu.shake = 1; return; }   // 비활성화: 아무 일도 없음
    for (const k in c.need) inv.mats[k] -= c.need[k];
    wallet.gold -= c.gold;
    const slot = ARMOR_SLOTS[si].key, it = addArmor(slot, gi);
    const auto = !equip[slot];
    if (auto) { equip[slot] = it; recalcStats(); }
    menu.fx = 1;
    menuMsg('제작 완료! ' + GRADES[gi].name + ' ' + armorName(it) + (auto ? ' (장착함)' : ''), '120,230,140');
  }
  function canForgeAny() {
    for (let i = 0; i < 4; i++) if (canEnhance(enhItem(i))) return true;
    for (let gi = 0; gi < 6; gi++) for (let si = 0; si < 3; si++) if (craftCheck(si, gi).ok) return true;
    return false;
  }

  // ----- 그리기 도우미 -----
  function mtext(t, x, y, size, color, align, bold) {
    ctx.font = (bold === false ? '' : 'bold ') + size + 'px system-ui, -apple-system, sans-serif';
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color || '#fff';
    ctx.fillText(t, x, y);
  }
  function mbtn(r, label, on, enabled, fn, size, primary) {
    const ok = enabled !== false, pr = primary && ok;   // primary: 강화·제작·장착처럼 실제로 하는 버튼 (초록)
    bevelBtn(r, on ? 'rgba(255,190,60,0.95)' : pr ? 'rgba(70,180,100,0.95)' : ok ? 'rgba(70,78,96,0.95)' : 'rgba(45,48,58,0.9)',
      on ? 'rgba(150,95,10,0.95)' : pr ? 'rgba(25,90,45,0.95)' : ok ? 'rgba(32,36,46,0.95)' : 'rgba(25,27,33,0.95)', ok ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.2)');
    fitText(label, r.w - 10, size || 15, true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = on ? '#3a2400' : ok ? '#fff' : 'rgba(255,255,255,0.35)';
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 - 1);
    if (fn) menuHit(r, fn);
  }

  function drawMenu() {
    if (!menu.open) return;
    menuHits = [];
    ctx.fillStyle = '#0d0f15';
    ctx.fillRect(0, 0, W, H);
    const pad = 12, top = safeTop + 10, tw = (W - pad * 2 - 12) / 3;
    MENU_TABS.forEach((t, i) => {
      mbtn({ x: pad + i * (tw + 6), y: top, w: tw, h: 38 }, t.name + ' (' + t.hot + ')', menu.tab === t.key, true, () => { menu.tab = t.key; });
    });
    const gy = top + 58;
    drawCoinIcon(pad + 9, gy, 9);
    mtext('골드 ' + fmtG(wallet.gold), pad + 24, gy + 1, 16, '#ffe9a0');
    mbtn({ x: W - pad - 96, y: gy - 15, w: 96, h: 30 }, '닫기 (Esc)', false, true, closeMenu, 13);
    const y0 = gy + 26;
    if (menu.tab === 'equip') drawEquipTab(y0);
    else if (menu.tab === 'forge') drawForgeTab(y0);
    else drawDexTab(y0);
    if (menu.msgT > 0) {
      ctx.globalAlpha = Math.min(1, menu.msgT / 0.3);
      ctx.font = 'bold 15px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const mw = ctx.measureText(menu.msg).width + 24;
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(W / 2 - mw / 2, H - 46, mw, 30);
      ctx.fillStyle = 'rgb(' + menu.msgColor + ')'; ctx.fillText(menu.msg, W / 2, H - 31);
      ctx.globalAlpha = 1;
    }
  }

  // ----- 장비 탭 -----
  function itemLines(it) {
    if (it.type === 'wpn') {
      const s = wStat(it), sk = it.def.skill ? SKILLS[it.def.skill] : null;
      return [KIND_NAME[it.def.kind] + ' · 대미지 ' + s.dmg + ' × ' + s.cnt + '발 · 공속 ' + s.rate + '/초 · 명중 ' + it.def.acc,
        '전투력 ' + fmtCP(weaponCP(it.def, it.lv)) + (sk ? '  ·  스킬 ' + sk.name + ' (쿨 ' + sk.cd + '초): ' + sk.desc : '')];
    }
    if (it.type === 'arm') return ['방어력 ' + armorDef(it.slot, it.grade, it.lv) + '  (0강 ' + armorDef0(it.slot, it.grade) + ', 10강 ' + armorDef0(it.slot, it.grade) * 3 + ')'];
    return [it.def.desc + '  ·  강화할 수 없음'];
  }
  function drawEquipTab(y0) {
    const pad = 12;

  // ----- 메뉴 키보드 -----
  function menuKey(e) {
    const k = keyOf(e), n = { Digit1: 1, Digit2: 2, Numpad1: 1, Numpad2: 2 }[e.code] ?? { '1': 1, '2': 2 }[e.key];
    const go = !e.repeat && (k === 'fire' || e.key === 'Enter');
    if (menu.tab === 'equip') {
      const bag = bagItems(), len = bag.length;
      if (!len) return;
      if (k === 'left') menu.sel = Math.max(0, menu.sel - 1);
      else if (k === 'right') menu.sel = Math.min(len - 1, menu.sel + 1);
      else if (k === 'up') menu.sel = Math.max(0, menu.sel - menu.cols);
      else if (k === 'down') menu.sel = Math.min(len - 1, menu.sel + menu.cols);
      else if (go && bag[menu.sel] && !(bag[menu.sel].type === 'wpn' && isEquipped(bag[menu.sel]))) toggleEquip(bag[menu.sel]);
      menu.page = Math.floor(menu.sel / menu.perPage);
    } else if (menu.tab === 'forge') {
      if (n === 1) menu.sub = 'enh';
      else if (n === 2) menu.sub = 'craft';
      else if (menu.sub === 'enh') {
        if (k === 'left') menu.enh = (menu.enh + 3) % 4;
        else if (k === 'right') menu.enh = (menu.enh + 1) % 4;
        else if (go) doEnhance();
      } else {
        if (k === 'left') menu.cg = (menu.cg + 5) % 6;
        else if (k === 'right') menu.cg = (menu.cg + 1) % 6;
        else if (k === 'up') menu.cs = (menu.cs + 2) % 3;
        else if (k === 'down') menu.cs = (menu.cs + 1) % 3;
        else if (go) doCraft();
      }
    } else {
      if (k === 'left') menu.dexSel = (menu.dexSel + 7) % 8;
      else if (k === 'right') menu.dexSel = (menu.dexSel + 1) % 8;
      else if (k === 'up' || k === 'down') menu.dexSel = (menu.dexSel + 4) % 8;
    }
  }

    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.fill();
    ctx.fillStyle = 'rgb(' + color + ')';
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.restore();
    // 둥근 입체 음영 (캡슐이 돌아도 빛은 늘 왼쪽 위)
    ctx.fillStyle = cached('cap|' + r, () => {
      const g = ctx.createRadialGradient(-r * 0.4, -r * 0.45, r * 0.05, -r * 0.1, -r * 0.1, r * 1.2);
      g.addColorStop(0, 'rgba(255,255,255,0.6)');
      g.addColorStop(0.4, 'rgba(255,255,255,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.38)');
      return g;
    });
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const DOME_CAPS = [[-36, 30], [-12, 38], [12, 38], [36, 30], [-46, 6], [-22, 10], [2, 14], [26, 10], [46, 6], [-12, -14], [14, -12]];
  const CAP_COLORS = ['200,210,225', '110,190,255', '255,120,90', '255,210,80', '120,230,140', '200,170,255', '255,120,150'];

  function drawGacha() {
    if (!gacha.open) return;
    const L = gachaLayout(), cx = L.cx, now = performance.now() / 1000;
    const p = gacha.prize, rolling = gacha.state === 'roll', show = gacha.state === 'show' && p;
    const legend = show && p.rar === 2;
    ctx.fillStyle = legend ? 'rgba(10,6,0,0.76)' : 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    if (legend) {
      // 전설: 돌아가는 금빛 줄기
      const Lr = Math.max(W, H) * 1.2;
      ctx.save();
      ctx.translate(cx, L.domeY); ctx.rotate(now * 0.5);
      ctx.fillStyle = 'rgba(255,200,60,0.10)';
      for (let i = 0; i < 14; i++) {
        ctx.rotate(Math.PI * 2 / 14);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-Lr * 0.12, -Lr); ctx.lineTo(Lr * 0.12, -Lr); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 제목
    ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.strokeText('아이템 뽑기', cx, L.titleY);
    ctx.fillStyle = '#d6b4ff';
    ctx.fillText('아이템 뽑기', cx, L.titleY);
    // 가진 코인
    const line = '가진 골드 ' + wallet.gold;
    ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
    const lw = ctx.measureText(line).width, lx = cx - (lw + 24) / 2;
    drawCoinIcon(lx + 9, L.coinY - 1, 9);
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
    ctx.fillText(line, lx + 24, L.coinY);
    ctx.textAlign = 'center';
    // 확률 안내
    ctx.font = '12px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const pct = n => Math.round(n * 100) + '%';
    ctx.fillText('일반 ' + pct(1 - GACHA.rare - GACHA.legend) + ' · 희귀 ' + pct(GACHA.rare) + ' · 전설 ' + pct(GACHA.legend), cx, L.rateY);

    // 뽑기 기계 — 유리 돔 + 캡슐
    const mx = cx + (rolling ? Math.sin(now * 60) * 2 : 0);
    ctx.fillStyle = 'rgba(190,225,255,0.16)';
    ctx.beginPath(); ctx.arc(mx, L.domeY, L.domeR, 0, Math.PI * 2); ctx.fill();
    const ca = Math.cos(gacha.spin), sa = Math.sin(gacha.spin);
    DOME_CAPS.forEach(([x, y], i) => {
      const j = rolling ? Math.sin(now * 40 + i * 2) * 2 : 0;
      drawCapsule(mx + x * ca - y * sa + j, L.domeY + x * sa + y * ca - j, 13, CAP_COLORS[i % CAP_COLORS.length], gacha.spin * 2 + i);
    });
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, L.domeY, L.domeR, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(mx, L.domeY, L.domeR - 12, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
    ctx.lineCap = 'butt';
    // 몸통
    const bx = mx - L.bodyW / 2, by = L.bodyY;
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(bx, by, L.bodyW, L.bodyH);
    ctx.fillStyle = '#e8574a';
    ctx.fillRect(bx, by, L.bodyW, 12);
    ctx.strokeStyle = '#4a0f0a'; ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, L.bodyW, L.bodyH);
    ctx.font = 'bold 18px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('뽑기', mx - 36, by + 42);
    // 손잡이 (뽑을 때 돌아감)
    const kx = mx + 44, ky = by + 42;
    ctx.fillStyle = '#f4f6fa'; ctx.strokeStyle = '#4a0f0a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.translate(kx, ky); ctx.rotate(gacha.knob);
    ctx.fillStyle = '#8a929c';
    ctx.fillRect(-15, -4, 30, 8);
    ctx.restore();
    // 나오는 구멍 + 나온 캡슐
    ctx.fillStyle = '#2a0a06';
    ctx.fillRect(mx - 28, by + L.bodyH - 34, 56, 26);
    if (show) drawCapsule(mx, by + L.bodyH - 21, 11, RARITY[p.rar].color, 0);

    // 결과 카드
    const c = L.card;
    cardShadow(c.x, c.y, c.w, c.h);
    ctx.fillStyle = 'rgba(30,34,40,0.94)';
    ctx.fillRect(c.x, c.y, c.w, c.h);
    if (show) {
      const rc = RARITY[p.rar];
      ctx.save();
      if (p.rar > 0) { ctx.shadowColor = 'rgba(' + rc.color + ',0.9)'; ctx.shadowBlur = 10 + 6 * Math.sin(now * 6); }
      ctx.strokeStyle = 'rgb(' + rc.color + ')'; ctx.lineWidth = p.rar === 2 ? 4 : 3;
      ctx.strokeRect(c.x, c.y, c.w, c.h);
      ctx.restore();
      ctx.textAlign = 'left';
      ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgb(' + rc.color + ')';
      ctx.fillText(rc.stars + ' ' + rc.name, c.x + 14, c.y + 17);
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgb(' + p.color + ')';
      fitText(p.title, c.w - 28, 22, true);
      ctx.fillText(p.title, cx, c.y + 44);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      fitText(p.desc, c.w - 28, 13, false);
      ctx.fillText(p.desc, cx, c.y + 69);
      if (p.bonus) {
        ctx.fillStyle = '#ffd24a';
        fitText(p.bonus, c.w - 28, 12, true);
        ctx.fillText(p.bonus, cx, c.y + 88);
      }
      if (gacha.fx > 0) {
        ctx.fillStyle = `rgba(255,255,255,${0.5 * gacha.fx})`;
        ctx.fillRect(c.x, c.y, c.w, c.h);
      }
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.strokeRect(c.x, c.y, c.w, c.h);
      if (rolling) {
        ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillText('두근두근…', cx, c.y + 20);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        fitText(gacha.name, c.w - 28, 22, true);
        ctx.fillText(gacha.name, cx, c.y + 54);
      } else {
        ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText('골드 ' + GACHA.cost + 'G로 한 번 뽑아요', cx, c.y + 38);
        ctx.font = '13px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('공격력 아이템 · 능력 · 무기 · 잭팟 능력', cx, c.y + 64);
      }
    }
    // 전설이면 크게 표시
    if (legend) {
      const pulse = 1 + 0.08 * Math.sin(now * 8) + gacha.fx * 0.5;
      ctx.save();
      ctx.translate(cx, L.domeY); ctx.scale(pulse, pulse);
      ctx.font = 'bold 34px system-ui, -apple-system, sans-serif';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(80,40,0,0.9)';
      ctx.strokeText('★ 전설! ★', 0, 0);
      ctx.shadowColor = 'rgba(255,200,60,0.9)'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('★ 전설! ★', 0, 0);
      ctx.restore();
    }
    // 안내 / 메시지
    if (gacha.msgT > 0) {
      ctx.globalAlpha = Math.min(1, gacha.msgT / 0.3);
      ctx.font = 'bold 15px system-ui, -apple-system, sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.strokeText(gacha.msg, cx, L.msgY);
      ctx.fillStyle = 'rgb(' + gacha.msgColor + ')';
      ctx.fillText(gacha.msg, cx, L.msgY);
      ctx.globalAlpha = 1;
    } else {
      ctx.font = '12px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('키보드: Space 뽑기 · G 닫기', cx, L.msgY);
    }
    // 뽑기 버튼
    const db = L.drawBtn, afford = wallet.gold >= GACHA.cost;
    const dbx = db.x + Math.sin(gacha.shake * 40) * 6 * gacha.shake;
    cardShadow(dbx, db.y, db.w, db.h);
    ctx.fillStyle = rolling ? 'rgba(90,80,110,0.8)' : afford ? 'rgba(160,100,245,0.95)' : 'rgba(95,80,120,0.8)';
    ctx.fillRect(dbx, db.y, db.w, db.h);

    if (rolling) {

      const label = show ? '한 번 더 뽑기' : '뽑기', cost = String(GACHA.cost);
      const tw = ctx.measureText(label).width;

      const total = tw + 14 + 18 + 4 + cw2, sx = dbx + db.w / 2 - total / 2;
      ctx.textAlign = 'left';

      ctx.fillStyle = afford ? '#ffffff' : 'rgba(255,255,255,0.7)';
      ctx.fillText(label, sx, db.y + db.h / 2 + 1);
      drawCoinIcon(sx + tw + 14 + 9, db.y + db.h / 2, 9);
      ctx.font = 'bold 17px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = afford ? '#ffe9a0' : '#ff8a7a';
      ctx.fillText(cost, sx + tw + 14 + 18 + 4, db.y + db.h / 2 + 1);

    // 닫기 버튼
    const cb = L.closeBtn;
    ctx.globalAlpha = rolling ? 0.4 : 1;
    cardShadow(cb.x, cb.y, cb.w, cb.h);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(cb.x, cb.y, cb.w, cb.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(cb.x, cb.y, cb.w, cb.h);
    ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('닫기 (G)', cx, cb.y + cb.h / 2 + 1);
    ctx.globalAlpha = 1;
    // 전설이 나온 순간 번쩍
    if (legend && gacha.fx > 0.6) {
      ctx.fillStyle = `rgba(255,236,170,${(gacha.fx - 0.6) / 0.4 * 0.7})`;
      ctx.fillRect(0, 0, W, H);

  }

  function drawTrans() {
    if (!trans.active) return;
    const a = trans.t < TRANS_HALF ? trans.t / TRANS_HALF : Math.max(0, 1 - (trans.t - TRANS_HALF) / (TRANS_HALF * 1.2));
    ctx.fillStyle = `rgba(8,6,20,${a})`;
    ctx.fillRect(0, 0, W, H);
    if (trans.switched) {
      ctx.globalAlpha = a;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 34px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgb(' + stageTheme().color + ')';
      ctx.fillText('스테이지 ' + stage.n, W / 2, H / 2 - 10);
      ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(stageTheme().name, W / 2, H / 2 + 26);
      ctx.globalAlpha = 1;
    }
  }

  function drawFloats() {
    ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of floats) {
      const k = f.t / 1.1;
      const sx = f.x - cam.x, sy = f.y - cam.y - k * 40;
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(0,0,0,${0.7 * (1 - k)})`;
      ctx.fillStyle = `rgba(${f.color || '255,214,90'},${1 - k})`;
      ctx.strokeText(f.text, sx, sy);
      ctx.fillText(f.text, sx, sy);
    }
  }

  function drawHud() {
    const text = '전투력 ' + fmtPower(effectiveCP());
    const size = 17 + power.flash * 6;
    ctx.font = `bold ${size}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(text).width;
    const x = 12, y = safeTop + 12, h = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, y, tw + 24, h);
    ctx.fillStyle = power.flash > 0 ? '#ffd65a' : '#ffffff';
    ctx.fillText(text, x + 12, y + h / 2 + 1);

    // 체력
    const hy = y + h + 6, bw = 150, bh = 16;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, hy, bw + 24, bh + 10);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 12, hy + 5, bw, bh);
    ctx.fillStyle = player.hurt > 0 ? '#ffffff' : '#e74c3c';
    ctx.fillRect(x + 12, hy + 5, bw * (player.hp / player.maxHp), bh);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x + 12, hy + 5, bw * (player.hp / player.maxHp), bh * 0.4);
    ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('체력 ' + player.hp + ' / ' + player.maxHp + '  ·  방어 ' + totalDefense(), x + 12 + bw / 2, hy + 5 + bh / 2 + 1);

    // 무기 (등급 색 + 강화 수치)
    const wy = hy + bh + 10 + 6;
    const wd = equip.weapon.def;
    const wtext = '무기 ' + wd.name + ' +' + equip.weapon.lv;
    ctx.font = `bold ${14 + weapon.fx * 4}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'left';
    const ww = ctx.measureText(wtext).width;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, wy, ww + 24, 26);
    ctx.fillStyle = gradeColor(wd.grade);
    ctx.fillText(wtext, x + 12, wy + 14);

    ctx.textAlign = 'right';
    const cbw = ctx.measureText(ct).width + 46, cby = safeTop + 12;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';

    drawCoinIcon(W - 12 - cbw + 18, cby + 17, 9);
    ctx.fillStyle = wallet.fx > 0 ? '#ffd65a' : '#ffffff';
    ctx.fillText(ct, W - 24, cby + 18);
    // 버튼: 대장간 · 뽑기 · 장비 · 도감 (할 수 있는 게 있으면 반짝임)
    HUD_BTNS.forEach((b, i) => {
      const r = hudBtnRect(i), ready = i === 0 ? canForgeAny() : i === 1 ? wallet.gold >= GACHA.cost : true;
      if (ready && i < 2) {
        ctx.fillStyle = i === 0 ? `rgba(255,214,90,${0.25 + 0.2 * Math.sin(performance.now() / 180)})` : `rgba(190,130,255,${0.25 + 0.2 * Math.sin(performance.now() / 180 + 1.5)})`;
        ctx.fillRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8);
      }
      bevelBtn(r, ready ? b.on : 'rgba(85,80,90,0.7)', ready ? b.side : 'rgba(45,42,50,0.85)', 'rgba(255,255,255,0.7)');
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = ready ? b.ink : 'rgba(255,255,255,0.85)';
      ctx.fillText(b.label, r.x + r.w / 2, r.y + r.h / 2 - 1);
    });
    // 스테이지 (왼쪽, 무기 아래)
    const th = stageTheme(), stx = '스테이지 ' + stage.n + ' · ' + th.name;
    ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    const sw = ctx.measureText(stx).width + 24, sty = wy + 26 + 4;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, sty, sw, 22);
    ctx.fillStyle = 'rgb(' + th.color + ')';
    ctx.fillText(stx, x + 12, sty + 12);

  function drawBullets() {
    ctx.lineCap = 'round';
    for (const b of bullets) {
      const lw = b.w || 4;
      const sx = b.x - cam.x, sy = b.y - cam.y;
      const tx = sx - b.vx * 0.015, ty = sy - b.vy * 0.015;
      if (b.glow) {
        // 빛나는 총알: 바깥 빛 + 하얀 심지
        ctx.strokeStyle = `rgba(${b.color},0.35)`;
        ctx.lineWidth = lw + 8;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = `rgb(${b.color})`;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = Math.max(1.5, lw * 0.35);
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
      } else {
        ctx.strokeStyle = `rgb(${b.color})`;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
        // 윗면 광택
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = Math.max(1.2, lw * 0.3);
        ctx.beginPath(); ctx.moveTo(sx - 0.8, sy - 0.8); ctx.lineTo(tx - 0.8, ty - 0.8); ctx.stroke();
      }
    }
    ctx.lineCap = 'butt';
  }

  // 동그란 버튼: 아래로 보이는 두께 + 누르면 윗면이 내려감 (누르는 범위는 그대로)
  const BTN_DEPTH = 5;
  function roundBtnBase(x, y, r, down, sideColor) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - r - 4, y - r - 4, r * 2 + 8, r * 2 + BTN_DEPTH + 8);
    ctx.arc(x, y + down, r, 0, Math.PI * 2);
    ctx.clip('evenodd');
    ctx.fillStyle = sideColor;
    ctx.beginPath(); ctx.arc(x, y + BTN_DEPTH, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function btnGrad(key, r, top, bottom) {
    return cached('btn|' + key + '|' + r, () => {
      const g = ctx.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, top); g.addColorStop(1, bottom);
      return g;
    });
  }
  function btnShine(r) {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r - 6, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function drawFireBtn() {
    const p = fireBtnPos(), r = fireBtn.r;
    const down = fireBtn.pressed ? BTN_DEPTH - 1 : 0, cy = p.y + down;
    roundBtnBase(p.x, p.y, r, down, 'rgba(120,30,20,0.6)');
    ctx.save();
    ctx.translate(p.x, cy);
    ctx.fillStyle = fireBtn.pressed
      ? btnGrad('fireOn', r, 'rgba(255,150,130,0.7)', 'rgba(215,60,45,0.6)')
      : btnGrad('fire', r, 'rgba(255,150,130,0.45)', 'rgba(205,55,40,0.32)');
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    btnShine(r);
    ctx.restore();
    // 조준경 모양
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(p.x, cy, 13, 0, Math.PI * 2);
    ctx.moveTo(p.x - 20, cy); ctx.lineTo(p.x - 6, cy);
    ctx.moveTo(p.x + 6, cy); ctx.lineTo(p.x + 20, cy);
    ctx.moveTo(p.x, cy - 20); ctx.lineTo(p.x, cy - 6);
    ctx.moveTo(p.x, cy + 6); ctx.lineTo(p.x, cy + 20);
    ctx.stroke();
  }

  function drawDashBtn() {
    if (pick.open || menu.open || gacha.open) return;   // 메뉴가 열려 있으면 숨김 (그동안은 쓸 수 없음)
    const p = dashBtnPos(), r = DASH.btnR;
    const ready = dash.cd <= 0;
    const down = dash.t > 0 ? BTN_DEPTH - 1 : 0, cy = p.y + down;
    roundBtnBase(p.x, p.y, r, down, ready ? 'rgba(20,70,120,0.6)' : 'rgba(25,30,40,0.6)');
    ctx.save();
    ctx.translate(p.x, cy);
    ctx.fillStyle = dash.t > 0 ? btnGrad('dashOn', r, 'rgba(190,240,255,0.75)', 'rgba(100,200,250,0.55)')
      : ready ? btnGrad('dash', r, 'rgba(130,215,255,0.45)', 'rgba(50,160,240,0.3)')
      : btnGrad('dashCd', r, 'rgba(90,100,115,0.5)', 'rgba(50,58,70,0.45)');
    ctx.strokeStyle = ready ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    btnShine(r);
    ctx.restore();
    // 다시 쓸 수 있을 때까지 남은 시간
    if (!ready) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.moveTo(p.x, cy);
      ctx.arc(p.x, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (dash.cd / DASH.cooldown));
      ctx.closePath();
      ctx.fill();
    }
    // » 모양
    ctx.strokeStyle = ready ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const ox of [-7, 3]) {
      ctx.moveTo(p.x + ox - 3, cy - 14); ctx.lineTo(p.x + ox + 4, cy - 7); ctx.lineTo(p.x + ox - 3, cy);
    }
    ctx.stroke();
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = ready ? '#ffffff' : 'rgba(255,255,255,0.6)';
    ctx.fillText('대쉬', p.x, cy + 12);
    ctx.font = '10px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Shift / K', p.x, p.y + r + BTN_DEPTH + 9);
  }

  function drawStick() {
    if (!stick.active) return;
    let dx = stick.x - stick.ox;
    let dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > stick.max) { dx = dx / d * stick.max; dy = dy / d * stick.max; }

    // 받침: 살짝 파인 홈
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(stick.ox, stick.oy, stick.max, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, stick.max - 4, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();

    // 손잡이: 동그란 입체 공
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.arc(stick.ox + dx + 2, stick.oy + dy + 4, 22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.55;
    drawBall(stick.ox + dx, stick.oy + dy, 22, '#e6edf5');
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    drawWorld();
    drawPortal();
    drawPools();
    drawBossTelegraphs();
    drawHitboxes();
    drawShadows();
    drawCorpses();     // 쓰러지는 3프레임
    drawItems();
    drawLoots();
    drawDashGhosts();
    drawActors();      // 몬스터 + 캐릭터 (아래쪽에 있는 것이 앞에)
    drawPoofs();
    drawLaser();
    drawRings(waves, 0.3);
    drawRings(shocks, 0.45);
    drawMonsterBars();
    drawPetTag();
    drawBullets();
    drawEnemyShots();
    drawBolts();
    drawBlades();
    drawPortalArrow();
    drawFloats();
    drawWarn();
    drawBanner();
    drawStick();
    drawFireBtn();
    drawDashBtn();
    drawSkillBtn();
    drawHud();
    drawPick();
    drawMenu();
    drawGacha();
    drawTrans();
  }

  function fitText(text, maxW, size, bold) {
    let sz = size;
    do { ctx.font = (bold ? 'bold ' : '') + sz + 'px system-ui, -apple-system, sans-serif'; sz--; }
    while (ctx.measureText(text).width > maxW && sz > 9);
  }

  function drawPick() {
    if (!pick.open) return;
    const jp = pick.jackpot;
    const now = performance.now() / 1000;
    ctx.fillStyle = jp ? 'rgba(10,6,0,0.72)' : 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    const rs = pickCardRects();
    if (jp) {
      // 잭팟: 돌아가는 금빛 줄기 + 반짝이
      const cx = W / 2, cy = rs[0].y - 40, L = Math.max(W, H) * 1.2;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(now * 0.5);
      ctx.fillStyle = 'rgba(255,200,60,0.10)';
      for (let i = 0; i < 14; i++) {
        ctx.rotate(Math.PI * 2 / 14);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-L * 0.12, -L); ctx.lineTo(L * 0.12, -L); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      for (let i = 0; i < 26; i++) {
        const hx = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1, hy = Math.abs(Math.sin(i * 78.233) * 12345.678) % 1;
        const tw = 0.5 + 0.5 * Math.sin(now * 5 + i * 1.7);
        const x = hx * W, y = hy * H, r = 2 + tw * 4;
        ctx.fillStyle = `rgba(255,230,140,${0.25 + 0.6 * tw})`;
        ctx.beginPath();
        ctx.moveTo(x, y - r * 2); ctx.lineTo(x + r * 0.5, y - r * 0.5); ctx.lineTo(x + r * 2, y);
        ctx.lineTo(x + r * 0.5, y + r * 0.5); ctx.lineTo(x, y + r * 2); ctx.lineTo(x - r * 0.5, y + r * 0.5);
        ctx.lineTo(x - r * 2, y); ctx.lineTo(x - r * 0.5, y - r * 0.5); ctx.closePath(); ctx.fill();
      }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (jp) {
      const pulse = 1 + 0.08 * Math.sin(now * 8) + Math.max(0, 0.5 - pick.openT) * 0.8;
      ctx.save();
      ctx.translate(W / 2, rs[0].y - 50); ctx.scale(pulse, pulse);
      ctx.font = 'bold 36px system-ui, -apple-system, sans-serif';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(80,40,0,0.9)';
      ctx.strokeText('★ 잭팟! ★', 0, 0);
      ctx.shadowColor = 'rgba(255,200,60,0.9)'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('★ 잭팟! ★', 0, 0);
      ctx.restore();
      ctx.font = '13px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,240,200,0.9)';
      ctx.fillText('좋은 능력 하나를 고르세요 (키보드 1 · 2 · 3)', W / 2, rs[0].y - 18);
    } else {
      ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.strokeText('강화 선택!', W / 2, rs[0].y - 44);
      ctx.fillStyle = '#ffd65a';
      ctx.fillText('강화 선택!', W / 2, rs[0].y - 44);
      ctx.font = '13px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText('하나를 눌러서 고르세요 (키보드 1 · 2 · 3)', W / 2, rs[0].y - 18);
    }
    const ready = pick.openT >= pickReadyT();
    for (let i = 0; i < pick.cards.length; i++) {
      const r = rs[i], o = pick.cards[i], on = pick.sel === i;
      ctx.globalAlpha = ready ? 1 : 0.6;
      cardShadow(r.x, r.y, r.w, r.h);
      ctx.fillStyle = on ? 'rgba(' + o.color + ',0.28)' : jp ? 'rgba(58,42,8,0.95)' : 'rgba(30,34,40,0.92)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      if (jp) {
        ctx.save();
        ctx.shadowColor = 'rgba(255,200,60,0.9)'; ctx.shadowBlur = 10 + 6 * Math.sin(now * 6 + i);
        ctx.strokeStyle = '#ffd24a';
        ctx.lineWidth = on ? 5 : 3;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.restore();
        ctx.font = 'bold 11px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffd24a';
        ctx.fillText('잭팟', r.x + r.w - 10, r.y + 14);
      } else {
        ctx.strokeStyle = 'rgb(' + o.color + ')';
        ctx.lineWidth = on ? 4 : 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgb(' + o.color + ')';
      ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
      ctx.fillText(String(i + 1), r.x + 12, r.y + 16);
      ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
      ctx.fillText(o.title, r.x + 30, r.y + r.h / 2 - 11);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      const d = o.desc();
      fitText(d, r.w - 42, 13, false);
      ctx.fillText(d, r.x + 30, r.y + r.h / 2 + 15);
    }
    ctx.globalAlpha = 1;
    // 잭팟이 뜬 순간 번쩍
    if (jp && pick.openT < 0.4) {
      ctx.fillStyle = `rgba(255,236,170,${(0.4 - pick.openT) / 0.4 * 0.7})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.textAlign = 'center';
  }

  // ===== 루프 =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (trans.active) updateTrans(dt);
    else if (pick.open) pick.openT += dt;
    else if (menu.open) updateMenuUi(dt);
    else if (gacha.open) updateGachaUi(dt);
    else update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
