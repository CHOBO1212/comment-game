<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>댓글로 만들어가는 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1b1f24;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 세계 =====
  const WORLD = { w: 3000, h: 3000 };
  const TILE = 60;

  // ===== 캐릭터 =====
  const player = {
    x: WORLD.w / 2,
    y: WORLD.h / 2,
    r: 16,
    speed: 220,      // 초당 픽셀
    dirX: 0,
    dirY: 1,         // 바라보는 방향
    moving: false,
    walkTime: 0,
    hp: 10,
    maxHp: 10,
    invuln: 0,       // 맞은 직후 잠깐 무적
    hurt: 0,         // 맞았을 때 붉게 깜빡임
    kbx: 0, kby: 0   // 맞았을 때 밀려남
  };

  // ===== 총 =====
  const gun = { cooldown: 0, rate: 0.18, bulletSpeed: 720, bulletLife: 0.75, recoil: 0 };
  const bullets = [];

  // ===== 무기 업그레이드 (아이템을 먹을 때 일정 확률로 다음 단계 무기로) =====
  const WEAPON_UPGRADE_CHANCE = 0.2;
  const WEAPONS = [
    { name: '권총',             rate: 0.18, shots: 1, spread: 0,    speed: 720, color: '255,226,122', body: '#3a3d44', len: 20, accent: null,      glow: false },
    { name: '기관총',           rate: 0.11, shots: 1, spread: 0,    speed: 780, color: '255,170,70',  body: '#2f3b2f', len: 27, accent: '#d4a72c', glow: false },
    { name: '삼연발 샷건',      rate: 0.15, shots: 3, spread: 0.16, speed: 760, color: '120,232,255', body: '#24476b', len: 25, accent: '#7ee8ff', glow: true  },
    { name: '레이저건',         rate: 0.09, shots: 3, spread: 0.11, speed: 920, color: '255,107,240', body: '#45285a', len: 29, accent: '#ff6bf0', glow: true  },
    { name: '황금 플라즈마 캐논', rate: 0.08, shots: 5, spread: 0.13, speed: 980, color: '255,240,160', body: '#b8860b', len: 33, accent: '#fff2a8', glow: true  }
  ];
  const weapon = { tier: 0, fx: 0 };
  function curWeapon() { return WEAPONS[weapon.tier]; }
  function tryUpgradeWeapon() {
    if (weapon.tier >= WEAPONS.length - 1) return;
    if (Math.random() >= WEAPON_UPGRADE_CHANCE) return;
    weapon.tier++;
    weapon.fx = 1;
    const w = curWeapon();
    gun.rate = w.rate;
    gun.bulletSpeed = w.speed;
    floats.push({ x: player.x, y: player.y - player.r - 36, t: 0, text: '무기 업그레이드! → ' + w.name, color: w.color });
  }

  // ===== 몬스터 =====
  const MONSTER_COUNT = 30;
  const monsters = [];
  const poofs = [];
  function spawnMonster() {
    let x, y, tries = 0;
    do {
      x = 80 + Math.random() * (WORLD.w - 160);
      y = 80 + Math.random() * (WORLD.h - 160);
      tries++;
    } while (Math.hypot(x - player.x, y - player.y) < 500 && tries < 50);
    const a = Math.random() * Math.PI * 2;
    monsters.push({
      x, y, r: 18, hp: 3, maxHp: 3, speed: 50 + Math.random() * 30,
      vx: Math.cos(a), vy: Math.sin(a), turn: 1 + Math.random() * 2,
      hit: 0, t: Math.random() * 10,
      state: 'wander', st: 0, atkCd: Math.random(), ax: 0, ay: 1, dealt: false
    });
  }

  // ===== 몬스터 공격 / 히트박스 =====
  // 가까이 오면 멈춰서 빨간 히트박스를 예고(windup) → 휘두름(attack) → 쉬기
  const ATK = {
    range: 95,        // 이 거리 안에 들어오면 공격 시작
    windup: 0.55,     // 예고 시간
    active: 0.15,     // 히트박스가 실제로 판정하는 시간
    cooldown: 1.2,    // 다음 공격까지
    reach: 26,        // 몬스터 몸 끝에서 히트박스 중심까지
    hbR: 24,          // 히트박스 반지름
    dmg: 1
  };
  function hitboxOf(m) {
    const reach = m.reach || ATK.reach;
    return { x: m.x + m.ax * (m.r + reach), y: m.y + m.ay * (m.r + reach), r: m.hbR || ATK.hbR };
  }
  const SPAWN = { x: WORLD.w / 2, y: WORLD.h / 2 };
  function hurtPlayer(dmg, fromX, fromY) {
    if (player.invuln > 0) return;
    player.hp = Math.max(0, player.hp - dmg);
    player.invuln = 0.7;
    player.hurt = 0.3;
    const dx = player.x - fromX, dy = player.y - fromY, d = Math.hypot(dx, dy) || 1;
    player.kbx = dx / d * 420; player.kby = dy / d * 420;
    floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '-' + dmg, color: '255,90,80' });
    if (player.hp <= 0) {
      poofs.push({ x: player.x, y: player.y, t: 0 });
      floats.push({ x: SPAWN.x, y: SPAWN.y - player.r - 30, t: 0, text: '쓰러졌다! 다시 시작', color: '255,90,80' });
      player.x = SPAWN.x; player.y = SPAWN.y;
      player.hp = player.maxHp;
      player.kbx = player.kby = 0;
      player.invuln = 1.5;
    }
  }
  for (let i = 0; i < MONSTER_COUNT; i++) spawnMonster();
  let respawnQueue = [];

  // ===== 중간 보스 (일정 시간마다 작은 몹을 불러냄) =====
  const BOSS = {
    x: WORLD.w / 2, y: WORLD.h / 2 - 350,   // 시작 지점 가까이 (플레이어가 약할 때 만나도록)
    r: 40, hp: 300, speed: 32,
    summonEvery: 5,   // 초마다 소환
    summonCount: 2,   // 한 번에 소환하는 수
    maxMinions: 8,    // 보스 한 마리당 살아 있을 수 있는 작은 몹 수
    respawn: 10,      // 쓰러진 뒤 다시 나타나기까지
    // 패턴
    patterns: ['fan', 'ring', 'charge', 'slam'],
    patEvery: 2.6, patRange: 560,
    fanShots: 5, fanSpread: 0.2, fanVolleys: 2,
    ringShots: 12, rings: 1,
    shotSpeed: 250, shotDmg: 1, shotR: 8, shotColor: '255,110,70',
    chargeSpeed: 600, chargeDmg: 2,
    slamR: 130, slamDmg: 2
  };
  let bossRespawn = 0;
  function spawnBoss() {
    monsters.push({
      boss: true, x: BOSS.x, y: BOSS.y, r: BOSS.r, hp: BOSS.hp, maxHp: BOSS.hp, speed: BOSS.speed,
      vx: 0, vy: 1, turn: 2, hit: 0, t: 0,
      state: 'wander', st: 0, atkCd: 1, ax: 0, ay: 1, dealt: false,
      reach: 34, hbR: 38, dmg: 2,
      summonT: BOSS.summonEvery, summonFx: 0,
      pat: null, patCd: 2, pt: 0, fired: 0, aim: 0, slamFx: 0
    });
  }

  // ===== 최종 보스 (끝판왕) — 게임 시작 5분 뒤 등장, 플레이어 힘에 맞춰 강해짐 =====
  const FINAL = {
    at: 300,          // 등장 시각 (초)
    r: 54, speed: 150,
    fightSec: 40,     // 지금 플레이어 화력으로 계속 맞혀도 이 정도 걸리는 체력
    patterns: ['fan', 'ring', 'charge', 'slam'],
    patEvery: 1.6, patRange: 700,
    fanShots: 7, fanSpread: 0.16, fanVolleys: 4,
    ringShots: 20, rings: 2,
    shotSpeed: 330, shotDmg: 2, shotR: 10, shotColor: '200,120,255',
    chargeSpeed: 780, chargeDmg: 3,
    slamR: 170, slamDmg: 3
  };
  let gameTime = 0, finalSpawned = false;
  const banner = { text: '', t: 0, color: '255,214,90' };
  function finalMaxHp() {
    const w = curWeapon();
    return playerDmg() * (w.shots / fireRate()) * FINAL.fightSec;
  }
  function spawnFinal() {
    finalSpawned = true;
    const a = Math.random() * Math.PI * 2;
    const x = Math.max(FINAL.r, Math.min(WORLD.w - FINAL.r, player.x + Math.cos(a) * 320));
    const y = Math.max(FINAL.r, Math.min(WORLD.h - FINAL.r, player.y + Math.sin(a) * 320));
    const hp = finalMaxHp();
    monsters.push({
      final: true, x, y, r: FINAL.r, hp, maxHp: hp, speed: FINAL.speed,
      vx: 0, vy: 1, turn: 2, hit: 0, t: 0,
      state: 'wander', st: 0, atkCd: 1, ax: 0, ay: 1, dealt: false,
      reach: 40, hbR: 46, dmg: 3,
      pat: null, patCd: 1.5, pt: 0, fired: 0, aim: 0, slamFx: 0
    });
    poofs.push({ x, y, t: 0 });
    banner.text = '최종 보스 등장! 끝판왕'; banner.t = 3; banner.color = '210,140,255';
  }

  // ===== 보스 원거리 탄 / 패턴 =====
  const enemyShots = [];
  const PAT = { fanWind: 0.5, fanGap: 0.22, ringWind: 0.7, ringGap: 0.35, chargeWind: 0.7, chargeDur: 0.5, slamWind: 0.9 };
  function bossShoot(m, B, a) {
    enemyShots.push({
      x: m.x + Math.cos(a) * m.r, y: m.y + Math.sin(a) * m.r,
      vx: Math.cos(a) * B.shotSpeed, vy: Math.sin(a) * B.shotSpeed,
      r: B.shotR, life: 3.5, dmg: B.shotDmg, color: B.shotColor
    });
  }
  // 패턴 진행 중이면 true (그동안 평소 이동/근접 공격은 쉼)
  function updateBossPattern(m, dt, pdx, pdy, pd) {
    const B = m.final ? FINAL : BOSS;
    if (!m.pat) {
      m.patCd -= dt;
      if (m.patCd > 0 || m.state !== 'wander' || pd > B.patRange) return false;
      m.pat = B.patterns[Math.floor(Math.random() * B.patterns.length)];
      m.pt = 0; m.fired = 0; m.dealt = false;
      m.aim = Math.atan2(pdy, pdx);
    }
    m.pt += dt;
    const toP = Math.atan2(pdy, pdx);
    let done = false;
    if (m.pat === 'fan') {
      // 부채꼴 조준 사격 (여러 번 연사)
      m.aim = toP;
      while (m.fired < B.fanVolleys && m.pt >= PAT.fanWind + m.fired * PAT.fanGap) {
        for (let s = 0; s < B.fanShots; s++) bossShoot(m, B, m.aim + (s - (B.fanShots - 1) / 2) * B.fanSpread);
        m.fired++;
      }
      done = m.fired >= B.fanVolleys && m.pt >= PAT.fanWind + B.fanVolleys * PAT.fanGap + 0.2;
    } else if (m.pat === 'ring') {
      // 사방으로 퍼지는 탄막
      while (m.fired < B.rings && m.pt >= PAT.ringWind + m.fired * PAT.ringGap) {
        const off = m.fired * Math.PI / B.ringShots + toP;
        for (let i = 0; i < B.ringShots; i++) bossShoot(m, B, off + i * Math.PI * 2 / B.ringShots);
        m.fired++;
      }
      done = m.fired >= B.rings && m.pt >= PAT.ringWind + B.rings * PAT.ringGap + 0.2;
    } else if (m.pat === 'charge') {
      // 돌진
      if (m.pt < PAT.chargeWind) {
        m.aim = toP; m.vx = Math.cos(toP); m.vy = Math.sin(toP);
      } else if (m.pt < PAT.chargeWind + PAT.chargeDur) {
        m.x += Math.cos(m.aim) * B.chargeSpeed * dt;
        m.y += Math.sin(m.aim) * B.chargeSpeed * dt;
        if (!m.dealt && Math.hypot(player.x - m.x, player.y - m.y) < m.r + player.r) {
          m.dealt = true;
          hurtPlayer(B.chargeDmg, m.x, m.y);
        }
      } else done = m.pt >= PAT.chargeWind + PAT.chargeDur + 0.35;
    } else if (m.pat === 'slam') {
      // 내려찍기 (넓은 범위)
      if (!m.dealt && m.pt >= PAT.slamWind) {
        m.dealt = true; m.slamFx = 1;
        if (pd < B.slamR + player.r) hurtPlayer(B.slamDmg, m.x, m.y);
      }
      done = m.pt >= PAT.slamWind + 0.35;
    }
    if (done) { m.pat = null; m.patCd = B.patEvery * (0.7 + Math.random() * 0.6); }
    return true;
  }
  function spawnMinion(boss) {
    const a = Math.random() * Math.PI * 2;
    const d = boss.r + 22;
    monsters.push({
      minion: true, x: boss.x + Math.cos(a) * d, y: boss.y + Math.sin(a) * d,
      r: 11, hp: 1, maxHp: 1, speed: 85 + Math.random() * 30,
      vx: Math.cos(a), vy: Math.sin(a), turn: 0.5 + Math.random(),
      hit: 0, t: Math.random() * 10,
      state: 'wander', st: 0, atkCd: 0.8 + Math.random(), ax: 0, ay: 1, dealt: false,
      reach: 16, hbR: 16
    });
    poofs.push({ x: boss.x + Math.cos(a) * d, y: boss.y + Math.sin(a) * d, t: 0 });
  }
  spawnBoss();

  // ===== 아이템 (몬스터가 죽으면 떨어짐, 먹으면 공격력이 2배씩 = 기하급수) =====
  const items = [];
  const floats = [];
  const power = { level: 0, dmg: 1, flash: 0 };
  const UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];
  function fmtPower(n) {
    if (!isFinite(n)) return '∞';
    if (n < 10000) return String(n);
    const u = Math.floor(Math.log10(n) / 4);
    if (u >= UNITS.length) return '2^' + power.level;
    const v = n / Math.pow(10000, u);
    return (v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10) + UNITS[u];
  }
  // ===== 30초마다 강화 선택 (데미지 / 체력 / 연사 속도) =====
  const PICK = {
    every: 30,          // 초
    dmgStep: 0.5,       // 데미지 선택 1번당 +50%
    hpStep: 3,          // 체력 선택 1번당 최대 체력 +3 (그만큼 회복)
    rateStep: 0.85,     // 연사 선택 1번당 발사 간격 ×0.85
    minRate: 0.03
  };
  const pick = { t: 0, open: false, openT: 0, sel: 0, dmgN: 0, hpN: 0, rateN: 0 };
  function dmgMul() { return 1 + PICK.dmgStep * pick.dmgN; }
  function playerDmg() { return power.dmg * dmgMul(); }
  function fireRate() { return Math.max(PICK.minRate, gun.rate * Math.pow(PICK.rateStep, pick.rateN)); }
  const PICK_OPTIONS = [
    { title: '데미지 증가', desc: () => '공격력 +50%  (지금 ×' + dmgMul() + ' → ×' + (dmgMul() + PICK.dmgStep) + ')', color: '255,140,90' },
    { title: '체력 증가', desc: () => '최대 체력 +' + PICK.hpStep + '  (' + player.maxHp + ' → ' + (player.maxHp + PICK.hpStep) + ')', color: '120,230,140' },
    { title: '총 쏘는 속도 증가', desc: () => '연사 속도 +' + Math.round((1 / PICK.rateStep - 1) * 100) + '%', color: '120,200,255' }
  ];
  function openPick() {
    pick.open = true; pick.openT = 0; pick.sel = 0;
    for (const k in keys) keys[k] = false;
    stickEnd();
    fireBtn.pressed = false; fireBtn.id = null;
  }
  function choosePick(i) {
    if (!pick.open || pick.openT < 0.35) return;
    pick.open = false;
    if (i === 0) {
      pick.dmgN++;
      floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '데미지 증가! ×' + dmgMul(), color: PICK_OPTIONS[0].color });
    } else if (i === 1) {
      pick.hpN++;
      player.maxHp += PICK.hpStep;
      player.hp = Math.min(player.maxHp, player.hp + PICK.hpStep);
      floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '최대 체력 +' + PICK.hpStep, color: PICK_OPTIONS[1].color });
    } else {
      pick.rateN++;
      floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '연사 속도 증가!', color: PICK_OPTIONS[2].color });
    }
  }
  function pickCardRects() {
    const cw = Math.min(W - 40, 340), ch = 78, gap = 14;
    const total = ch * 3 + gap * 2;
    const y0 = Math.max(safeTop + 90, H / 2 - total / 2 + 20);
    const x0 = (W - cw) / 2;
    return [0, 1, 2].map(i => ({ x: x0, y: y0 + i * (ch + gap), w: cw, h: ch }));
  }

  function eatItem() {
    power.level++;
    power.dmg = Math.pow(2, power.level);
    power.flash = 1;
    floats.push({ x: player.x, y: player.y - player.r - 12, t: 0, text: '공격력 ×2 → ' + fmtPower(playerDmg()) });
    tryUpgradeWeapon();
  }

  // ===== 카메라 =====
  const cam = { x: 0, y: 0 };

  // 노치가 있는 폰에서 위쪽 표시가 가려지지 않게 안전 영역 확인
  const safeProbe = document.createElement('div');
  safeProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);';
  document.body.appendChild(safeProbe);
  let safeTop = 0;

  // ===== 화면 크기 =====
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    safeTop = parseFloat(getComputedStyle(safeProbe).paddingTop) || 0;
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== 키보드 입력 =====
  const keys = {};
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'fire', KeyJ: 'fire'
  };
  // e.code가 비어 있는 환경을 위해 e.key로도 확인
  const KEYMAP_BY_KEY = {
    ArrowUp: 'up', Up: 'up', w: 'up', W: 'up', 'ㅈ': 'up',
    ArrowDown: 'down', Down: 'down', s: 'down', S: 'down', 'ㄴ': 'down',
    ArrowLeft: 'left', Left: 'left', a: 'left', A: 'left', 'ㅁ': 'left',
    ArrowRight: 'right', Right: 'right', d: 'right', D: 'right', 'ㅇ': 'right',
    ' ': 'fire', Spacebar: 'fire', j: 'fire', J: 'fire', 'ㅓ': 'fire'
  };
  const keyOf = e => KEYMAP[e.code] || KEYMAP_BY_KEY[e.key];
  document.addEventListener('keydown', e => {
    if (pick.open) {
      // 강화 선택: 1/2/3 바로 선택, 위아래로 고르고 Enter/Space로 결정
      const n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code] ?? { '1': 0, '2': 1, '3': 2 }[e.key];
      const k = keyOf(e);
      if (n !== undefined) choosePick(n);
      else if (k === 'up' || k === 'left') pick.sel = (pick.sel + 2) % 3;
      else if (k === 'down' || k === 'right') pick.sel = (pick.sel + 1) % 3;
      else if (!e.repeat && (k === 'fire' || e.key === 'Enter')) choosePick(pick.sel);
      e.preventDefault();
      return;
    }
    const k = keyOf(e);
    if (k) { keys[k] = true; e.preventDefault(); }
  }, true);
  document.addEventListener('keyup', e => {
    const k = keyOf(e);
    if (k) { keys[k] = false; e.preventDefault(); }
  }, true);
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // 키보드 포커스 확보 (미리보기 창 안에서 열려도 키 입력이 들어오도록)
  canvas.tabIndex = 0;
  canvas.style.outline = 'none';
  function grabFocus() {
    try { window.focus(); } catch (_) {}
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
  }
  grabFocus();
  window.addEventListener('load', grabFocus);
  document.addEventListener('pointerdown', grabFocus, true);
  document.addEventListener('mouseenter', grabFocus);

  // ===== 터치 조이스틱 (화면 아무 곳이나 누르고 끌기) =====
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, max: 50 };

  function stickStart(id, x, y) {
    stick.active = true;
    stick.id = id;
    stick.ox = x; stick.oy = y;
    stick.x = x; stick.y = y;
  }
  function stickMove(x, y) {
    stick.x = x; stick.y = y;
  }
  function stickEnd() {
    stick.active = false;
    stick.id = null;
  }

  // ===== 발사 버튼 (오른쪽 아래) =====
  const fireBtn = { r: 40, pressed: false, id: null };
  function fireBtnPos() {
    return { x: W - fireBtn.r - 28, y: H - fireBtn.r - 40 };
  }
  function onFireBtn(x, y) {
    const p = fireBtnPos();
    return Math.hypot(x - p.x, y - p.y) <= fireBtn.r + 14;
  }

  canvas.addEventListener('pointerdown', e => {
    if (pick.open) {
      const rs = pickCardRects();
      for (let i = 0; i < rs.length; i++) {
        const r = rs[i];
        if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) {
          pick.sel = i; choosePick(i); break;
        }
      }
      e.preventDefault();
      return;
    }
    if (!fireBtn.pressed && onFireBtn(e.clientX, e.clientY)) {
      canvas.setPointerCapture(e.pointerId);
      fireBtn.pressed = true;
      fireBtn.id = e.pointerId;
      e.preventDefault();
      return;
    }
    if (stick.active) return;
    canvas.setPointerCapture(e.pointerId);
    stickStart(e.pointerId, e.clientX, e.clientY);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (stick.active && e.pointerId === stick.id) {
      stickMove(e.clientX, e.clientY);
      e.preventDefault();
    }
  });
  const endHandler = e => {
    if (stick.active && e.pointerId === stick.id) stickEnd();
    if (fireBtn.pressed && e.pointerId === fireBtn.id) { fireBtn.pressed = false; fireBtn.id = null; }
  };
  canvas.addEventListener('pointerup', endHandler);
  canvas.addEventListener('pointercancel', endHandler);

  function getInput() {
    let ix = 0, iy = 0;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;
    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;

    if (stick.active) {
      let dx = stick.x - stick.ox;
      let dy = stick.y - stick.oy;
      const d = Math.hypot(dx, dy);
      if (d > 8) {
        const m = Math.min(d, stick.max) / stick.max;
        ix += (dx / d) * m;
        iy += (dy / d) * m;
      }
    }

    const len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; }
    return { x: ix, y: iy };
  }

  // ===== 업데이트 =====
  function update(dt) {
    const inp = getInput();
    const mag = Math.hypot(inp.x, inp.y);
    player.moving = mag > 0.05;

    if (player.moving) {
      player.x += inp.x * player.speed * dt;
      player.y += inp.y * player.speed * dt;
      player.dirX = inp.x / mag;
      player.dirY = inp.y / mag;
      player.walkTime += dt * (6 + 6 * mag);
    } else {
      player.walkTime = 0;
    }

    // 맞았을 때 밀려남 / 무적 시간
    player.x += player.kbx * dt; player.y += player.kby * dt;
    const kd = Math.exp(-dt * 12); player.kbx *= kd; player.kby *= kd;
    player.invuln = Math.max(0, player.invuln - dt);
    player.hurt = Math.max(0, player.hurt - dt);

    // 세계 경계
    player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
    player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));

    // 총 쏘기
    gun.cooldown -= dt;
    gun.recoil = Math.max(0, gun.recoil - dt * 6);
    if ((keys.fire || fireBtn.pressed) && gun.cooldown <= 0) {
      gun.cooldown = fireRate();
      gun.recoil = 1;
      const w = curWeapon();
      const mx = player.x + player.dirX * (player.r + 14);
      const my = player.y + player.dirY * (player.r + 14);
      const base = Math.atan2(player.dirY, player.dirX);
      for (let s = 0; s < w.shots; s++) {
        const a = base + (s - (w.shots - 1) / 2) * w.spread;
        bullets.push({
          x: mx, y: my,
          vx: Math.cos(a) * gun.bulletSpeed, vy: Math.sin(a) * gun.bulletSpeed,
          spd: gun.bulletSpeed, color: w.color, glow: w.glow,
          life: gun.bulletLife
        });
      }
    }
    weapon.fx = Math.max(0, weapon.fx - dt * 1.2);

    // 30초마다 강화 선택
    pick.t += dt;
    if (pick.t >= PICK.every) { pick.t -= PICK.every; openPick(); return; }

    // 최종 보스: 5분 뒤 등장 + 체력을 플레이어 힘에 맞춤 (남은 비율 유지)
    gameTime += dt;
    if (!finalSpawned && gameTime >= FINAL.at) spawnFinal();
    for (const m of monsters) {
      if (!m.final) continue;
      const nm = finalMaxHp();
      if (nm !== m.maxHp) { m.hp = m.hp / m.maxHp * nm; m.maxHp = nm; }
    }
    banner.t = Math.max(0, banner.t - dt);

    // 총알 이동 + 몬스터 명중
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WORLD.w || b.y > WORLD.h;
      if (!dead) {
        for (let j = monsters.length - 1; j >= 0; j--) {
          const m = monsters[j];
          if (Math.hypot(b.x - m.x, b.y - m.y) < m.r + 4) {
            m.hp -= playerDmg(); m.hit = 0.12;
            m.x += b.vx / b.spd * 6; m.y += b.vy / b.spd * 6;
            dead = true;
            if (m.hp <= 0) {
              poofs.push({ x: m.x, y: m.y, t: 0 });
              items.push({ x: m.x, y: m.y, r: 11, t: 0 });
              monsters.splice(j, 1);
              if (m.boss) {
                bossRespawn = BOSS.respawn;
                floats.push({ x: m.x, y: m.y - m.r - 20, t: 0, text: '중간 보스 처치!', color: '255,120,90' });
              } else if (m.final) {
                banner.text = '최종 보스 처치!'; banner.t = 3; banner.color = '255,214,90';
              } else if (!m.minion) respawnQueue.push(3);
            }
            break;
          }
        }
      }
      if (dead) bullets.splice(i, 1);
    }

    // 몬스터 돌아다니기
    // 중간 보스: 일정 시간마다 작은 몹 소환
    for (const m of monsters.slice()) {
      if (!m.boss) continue;
      m.summonFx = Math.max(0, m.summonFx - dt * 1.5);
      m.summonT -= dt;
      if (m.summonT <= 0) {
        m.summonT = BOSS.summonEvery;
        const alive = monsters.filter(o => o.minion).length;
        const n = Math.min(BOSS.summonCount, BOSS.maxMinions - alive);
        if (n > 0) {
          for (let i = 0; i < n; i++) spawnMinion(m);
          m.summonFx = 1;
          floats.push({ x: m.x, y: m.y - m.r - 20, t: 0, text: '소환!', color: '255,120,90' });
        }
      }
    }
    if (bossRespawn > 0) {
      bossRespawn -= dt;
      if (bossRespawn <= 0) spawnBoss();
    }

    for (const m of monsters) {
      m.t += dt;
      m.hit = Math.max(0, m.hit - dt);
      m.atkCd = Math.max(0, m.atkCd - dt);
      const pdx = player.x - m.x, pdy = player.y - m.y;
      const pd = Math.hypot(pdx, pdy);
      if (m.boss || m.final) {
        m.slamFx = Math.max(0, m.slamFx - dt * 2.5);
        if (updateBossPattern(m, dt, pdx, pdy, pd)) {
          m.x = Math.max(m.r, Math.min(WORLD.w - m.r, m.x));
          m.y = Math.max(m.r, Math.min(WORLD.h - m.r, m.y));
          continue;
        }
      }
      if (m.state === 'wander' && m.atkCd <= 0 && pd - player.r - m.r < ATK.range) {
        m.state = 'windup'; m.st = 0; m.dealt = false;
        m.ax = pdx / (pd || 1); m.ay = pdy / (pd || 1);
      }
      if (m.state === 'windup') {
        m.st += dt;
        // 예고 중에는 플레이어 쪽으로 천천히 조준
        const tx = pdx / (pd || 1), ty = pdy / (pd || 1);
        m.ax += (tx - m.ax) * Math.min(1, dt * 4); m.ay += (ty - m.ay) * Math.min(1, dt * 4);
        const al = Math.hypot(m.ax, m.ay) || 1; m.ax /= al; m.ay /= al;
        m.vx = m.ax; m.vy = m.ay;
        if (m.st >= ATK.windup) { m.state = 'attack'; m.st = 0; }
      } else if (m.state === 'attack') {
        m.st += dt;
        const hb = hitboxOf(m);
        if (!m.dealt && Math.hypot(player.x - hb.x, player.y - hb.y) < hb.r + player.r) {
          m.dealt = true;
          hurtPlayer(m.dmg || ATK.dmg, m.x, m.y);
        }
        if (m.st >= ATK.active) { m.state = 'wander'; m.atkCd = ATK.cooldown; m.turn = 0.5 + Math.random(); }
      } else if (m.final) {
        // 최종 보스는 플레이어를 쫓아옴
        m.vx = pdx / (pd || 1); m.vy = pdy / (pd || 1);
        m.x += m.vx * m.speed * dt;
        m.y += m.vy * m.speed * dt;
      } else {
        m.turn -= dt;
        if (m.turn <= 0) {
          const a = Math.random() * Math.PI * 2;
          m.vx = Math.cos(a); m.vy = Math.sin(a);
          m.turn = 1 + Math.random() * 2.5;
        }
        m.x += m.vx * m.speed * dt;
        m.y += m.vy * m.speed * dt;
      }
      if (m.x < m.r || m.x > WORLD.w - m.r) { m.vx *= -1; m.x = Math.max(m.r, Math.min(WORLD.w - m.r, m.x)); }
      if (m.y < m.r || m.y > WORLD.h - m.r) { m.vy *= -1; m.y = Math.max(m.r, Math.min(WORLD.h - m.r, m.y)); }
    }

    // 보스 원거리 탄 이동 + 플레이어 명중
    for (let i = enemyShots.length - 1; i >= 0; i--) {
      const s = enemyShots[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      let gone = s.life <= 0 || s.x < 0 || s.y < 0 || s.x > WORLD.w || s.y > WORLD.h;
      if (!gone && Math.hypot(s.x - player.x, s.y - player.y) < s.r + player.r) {
        hurtPlayer(s.dmg, s.x - s.vx, s.y - s.vy);
        gone = true;
      }
      if (gone) enemyShots.splice(i, 1);
    }

    // 쓰러진 몬스터는 잠시 뒤 다른 곳에 다시 나타남
    for (let i = respawnQueue.length - 1; i >= 0; i--) {
      respawnQueue[i] -= dt;
      if (respawnQueue[i] <= 0) { respawnQueue.splice(i, 1); spawnMonster(); }
    }

    // 아이템 먹기 (닿으면 먹음)
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.t += dt;
      if (Math.hypot(it.x - player.x, it.y - player.y) < player.r + it.r) {
        items.splice(i, 1);
        eatItem();
      }
    }
    power.flash = Math.max(0, power.flash - dt * 2);
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].t += dt;
      if (floats[i].t > 1.1) floats.splice(i, 1);
    }

    // 쓰러짐 효과
    for (let i = poofs.length - 1; i >= 0; i--) {
      poofs[i].t += dt;
      if (poofs[i].t > 0.4) poofs.splice(i, 1);
    }

    // 카메라: 캐릭터를 화면 가운데에
    cam.x = player.x - W / 2;
    cam.y = player.y - H / 2;
  }

  // ===== 그리기 =====
  function drawWorld() {
    // 바깥(세계 밖)
    ctx.fillStyle = '#1b1f24';
    ctx.fillRect(0, 0, W, H);

    // 세계 바닥
    ctx.fillStyle = '#3f5a3c';
    ctx.fillRect(-cam.x, -cam.y, WORLD.w, WORLD.h);

    // 움직임이 보이도록 옅은 격자
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const startX = Math.max(0, Math.floor(cam.x / TILE) * TILE);
    const endX = Math.min(WORLD.w, cam.x + W + TILE);
    const startY = Math.max(0, Math.floor(cam.y / TILE) * TILE);
    const endY = Math.min(WORLD.h, cam.y + H + TILE);
    ctx.beginPath();
    for (let x = startX; x <= endX; x += TILE) {
      const sx = Math.round(x - cam.x) + 0.5;
      ctx.moveTo(sx, Math.max(0, -cam.y));
      ctx.lineTo(sx, Math.min(H, WORLD.h - cam.y));
    }
    for (let y = startY; y <= endY; y += TILE) {
      const sy = Math.round(y - cam.y) + 0.5;
      ctx.moveTo(Math.max(0, -cam.x), sy);
      ctx.lineTo(Math.min(W, WORLD.w - cam.x), sy);
    }
    ctx.stroke();

    // 세계 테두리
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 6;
    ctx.strokeRect(-cam.x, -cam.y, WORLD.w, WORLD.h);
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 1) ctx.globalAlpha = 0.45;
    const sx = player.x - cam.x;
    const sy = player.y - cam.y;
    const bob = player.moving ? Math.abs(Math.sin(player.walkTime)) * 3 : 0;

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + player.r * 0.7, player.r * 0.95, player.r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // 발 (걷는 모션)
    const step = player.moving ? Math.sin(player.walkTime) * 5 : 0;
    const px = -player.dirY, py = player.dirX; // 진행 방향의 수직
    ctx.fillStyle = '#2b2b3a';
    for (const side of [-1, 1]) {
      const fx = sx + px * side * 7 + player.dirX * step * side;
      const fy = sy + py * side * 7 + player.dirY * step * side + 4;
      ctx.beginPath();
      ctx.arc(fx, fy, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 몸
    const by = sy - bob;
    ctx.fillStyle = player.hurt > 0 ? '#ff6a5a' : '#f2c14e';
    ctx.strokeStyle = '#7a5a12';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, by, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 총 (바라보는 방향으로 듦)
    {
      const back = gun.recoil * 3;
      const gx = sx + player.dirX * (player.r - 4 - back) + px * 6;
      const gy = by + player.dirY * (player.r - 4 - back) + py * 6;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(Math.atan2(player.dirY, player.dirX));
      const w = curWeapon();
      const L = w.len;
      // 빛나는 무기는 주변에 은은한 빛
      if (w.glow) {
        ctx.fillStyle = `rgba(${w.color},${0.18 + 0.08 * Math.sin(performance.now() / 150)})`;
        ctx.beginPath();
        ctx.ellipse(L / 2 - 2, 0, L / 2 + 8, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = w.body;
      ctx.strokeStyle = '#15171b';
      ctx.lineWidth = 1.5;
      ctx.fillRect(-4, -3.5, L, 7);
      ctx.strokeRect(-4, -3.5, L, 7);
      ctx.fillRect(-2, 2, 5, 6);
      ctx.strokeRect(-2, 2, 5, 6);
      if (w.accent) {
        // 무기 띠 장식
        ctx.fillStyle = w.accent;
        ctx.fillRect(2, -1.2, L - 10, 2.4);
        // 총구 끝 장식
        ctx.fillRect(L - 7, -4.5, 3, 9);
      }
      if (weapon.tier >= 2) {
        // 위쪽 보조 총열
        ctx.fillStyle = w.body;
        ctx.fillRect(0, -7, L - 8, 3.5);
        ctx.strokeRect(0, -7, L - 8, 3.5);
      }
      if (weapon.tier >= 4) {
        // 캐논 에너지 코어
        ctx.fillStyle = `rgba(${w.color},${0.7 + 0.3 * Math.sin(performance.now() / 90)})`;
        ctx.beginPath();
        ctx.arc(4, 0, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      if (gun.recoil > 0.7) {
        ctx.fillStyle = `rgb(${w.color})`;
        ctx.beginPath();
        ctx.arc(L - 1, 0, 5 + weapon.tier, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 무기 업그레이드 순간 빛나는 고리
    if (weapon.fx > 0) {
      const k = 1 - weapon.fx;
      ctx.strokeStyle = `rgba(${curWeapon().color},${weapon.fx})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(sx, by, player.r + 6 + k * 40, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 눈 (바라보는 방향)
    const ex = sx + player.dirX * 7;
    const ey = by + player.dirY * 7;
    ctx.fillStyle = '#222';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(ex + px * side * 5, ey + py * side * 5, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBossTelegraphs() {
    for (const m of monsters) {
      if (!m.boss && !m.final) continue;
      const B = m.final ? FINAL : BOSS;
      const sx = m.x - cam.x, sy = m.y - cam.y;
      if (sx < -400 || sy < -400 || sx > W + 400 || sy > H + 400) continue;
      ctx.save();
      if (m.pat === 'slam' && m.pt < PAT.slamWind) {
        const k = m.pt / PAT.slamWind;
        ctx.fillStyle = 'rgba(255,60,50,0.12)';
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,50,0.3)';
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR * k, 0, Math.PI * 2); ctx.fill();
        ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,80,70,0.9)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR, 0, Math.PI * 2); ctx.stroke();
      } else if (m.pat === 'charge' && m.pt < PAT.chargeWind) {
        const len = B.chargeSpeed * PAT.chargeDur;
        ctx.translate(sx, sy); ctx.rotate(m.aim);
        ctx.fillStyle = `rgba(255,60,50,${0.15 + 0.2 * (m.pt / PAT.chargeWind)})`;
        ctx.fillRect(0, -m.r, len, m.r * 2);
        ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,80,70,0.9)'; ctx.lineWidth = 2;
        ctx.strokeRect(0, -m.r, len, m.r * 2);
      } else if (m.pat === 'fan' && m.fired === 0) {
        ctx.strokeStyle = `rgba(${B.shotColor},0.55)`; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        for (let s = 0; s < B.fanShots; s++) {
          const a = m.aim + (s - (B.fanShots - 1) / 2) * B.fanSpread;
          ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * m.r, sy + Math.sin(a) * m.r);
          ctx.lineTo(sx + Math.cos(a) * (m.r + 160), sy + Math.sin(a) * (m.r + 160)); ctx.stroke();
        }
      } else if (m.pat === 'ring' && m.fired === 0) {
        const k = m.pt / PAT.ringWind;
        ctx.strokeStyle = `rgba(${B.shotColor},${0.4 + 0.5 * k})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(sx, sy, m.r + 30 - k * 22, 0, Math.PI * 2); ctx.stroke();
      }
      if (m.slamFx > 0) {
        ctx.setLineDash([]);
        ctx.strokeStyle = `rgba(255,200,120,${m.slamFx})`; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(sx, sy, B.slamR * (1.05 - m.slamFx * 0.3), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawEnemyShots() {
    for (const s of enemyShots) {
      const sx = s.x - cam.x, sy = s.y - cam.y;
      if (sx < -30 || sy < -30 || sx > W + 30 || sy > H + 30) continue;
      ctx.fillStyle = `rgba(${s.color},0.3)`;
      ctx.beginPath(); ctx.arc(sx, sy, s.r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgb(${s.color})`;
      ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(sx, sy, s.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBanner() {
    if (banner.t <= 0) return;
    const a = Math.min(1, banner.t / 0.5);
    ctx.font = 'bold 26px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = safeTop + 150;
    ctx.lineWidth = 6; ctx.strokeStyle = `rgba(0,0,0,${0.75 * a})`;
    ctx.strokeText(banner.text, W / 2, y);
    ctx.fillStyle = `rgba(${banner.color},${a})`;
    ctx.fillText(banner.text, W / 2, y);
  }

  function drawHitboxes() {
    for (const m of monsters) {
      if (m.state !== 'windup' && m.state !== 'attack') continue;
      const hb = hitboxOf(m);
      const sx = hb.x - cam.x, sy = hb.y - cam.y;
      if (sx < -80 || sy < -80 || sx > W + 80 || sy > H + 80) continue;
      ctx.save();
      if (m.state === 'windup') {
        const k = m.st / ATK.windup;
        // 예고: 점선 테두리 + 안쪽이 점점 차오름
        ctx.fillStyle = 'rgba(255,60,50,0.12)';
        ctx.beginPath(); ctx.arc(sx, sy, hb.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,50,0.35)';
        ctx.beginPath(); ctx.arc(sx, sy, hb.r * k, 0, Math.PI * 2); ctx.fill();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = 'rgba(255,80,70,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, hb.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        // 판정 중: 진한 빨강
        ctx.fillStyle = 'rgba(255,40,30,0.6)';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sx, sy, hb.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawMonsters() {
    for (const m of monsters) {
      const sx = m.x - cam.x, sy = m.y - cam.y;
      const cull = m.r + 60;
      if (sx < -cull || sy < -cull || sx > W + cull || sy > H + cull) continue;
      const sc = m.r / 18;
      let wob = Math.sin(m.t * 6) * 1.5 * sc;
      let sx0 = sx, sy0 = sy;
      if (m.state === 'windup') {
        sx0 += (Math.random() - 0.5) * 3; sy0 += (Math.random() - 0.5) * 3;
        sx0 -= m.ax * 4 * (m.st / ATK.windup); sy0 -= m.ay * 4 * (m.st / ATK.windup);
      } else if (m.state === 'attack') {
        sx0 += m.ax * 10; sy0 += m.ay * 10;
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + m.r * 0.7, m.r, m.r * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      const angry = m.state === 'windup' || m.state === 'attack';
      if (m.boss) {
        // 소환할 때 퍼지는 고리
        if (m.summonFx > 0) {
          ctx.strokeStyle = `rgba(255,90,60,${m.summonFx})`;
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(sx, sy, m.r + 8 + (1 - m.summonFx) * 50, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = m.hit > 0 ? '#ffffff' : angry ? '#d63a2a' : '#a8281c';
        ctx.strokeStyle = '#4a0f0a';
        ctx.lineWidth = 3;
      } else if (m.final) {
        ctx.fillStyle = m.hit > 0 ? '#ffffff' : angry || m.pat ? '#4a2470' : '#2a1240';
        ctx.strokeStyle = '#ffd24a';
        ctx.lineWidth = 4;
      } else if (m.minion) {
        ctx.fillStyle = m.hit > 0 ? '#ffffff' : angry ? '#ff8a5c' : '#e8673c';
        ctx.strokeStyle = '#6a2410';
        ctx.lineWidth = 2;
      } else {
        ctx.fillStyle = m.hit > 0 ? '#ffffff' : angry ? '#b0388f' : '#8e44ad';
        ctx.strokeStyle = '#4a1f5c';
        ctx.lineWidth = 2;
      }
      ctx.beginPath();
      ctx.ellipse(sx0, sy0 - wob, m.r + wob * 0.5, m.r - wob * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 보스 뿔
      if (m.boss) {
        ctx.fillStyle = '#f3e6c4';
        ctx.strokeStyle = '#4a0f0a';
        ctx.lineWidth = 2;
        const top = sy0 - wob - m.r + 6;
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(sx0 + side * 14, top + 4);
          ctx.lineTo(sx0 + side * 30, top - 22);
          ctx.lineTo(sx0 + side * 26, top + 8);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      }
      // 최종 보스 왕관
      if (m.final) {
        const top = sy0 - wob - m.r + 4;
        ctx.fillStyle = '#ffd24a'; ctx.strokeStyle = '#6a4a00'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx0 - 26, top + 6);
        ctx.lineTo(sx0 - 26, top - 16); ctx.lineTo(sx0 - 13, top - 4);
        ctx.lineTo(sx0, top - 22); ctx.lineTo(sx0 + 13, top - 4);
        ctx.lineTo(sx0 + 26, top - 16); ctx.lineTo(sx0 + 26, top + 6);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#d63ad6';
        ctx.beginPath(); ctx.arc(sx0, top - 2, 3.5, 0, Math.PI * 2); ctx.fill();
      }

      // 눈
      const ex = sx0 + m.vx * 6 * sc, ey = sy0 - wob + (m.vy * 6 - 3) * sc;
      ctx.fillStyle = m.boss ? '#ffe36a' : m.final ? '#ff5af0' : '#fff';
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.arc(ex + side * 6 * sc, ey, 4 * sc, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = m.boss || m.final ? '#2a0000' : '#c0392b';
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.arc(ex + side * 6 * sc + m.vx * 1.5 * sc, ey + m.vy * 1.5 * sc, 2 * sc, 0, Math.PI * 2); ctx.fill();
      }

      // 체력바 (보스는 항상 표시 + 이름)
      if (m.boss) {
        const bw = 90, by0 = sy - m.r - 42;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(sx - bw / 2, by0, bw, 8);
        ctx.fillStyle = '#ff4a3a';
        ctx.fillRect(sx - bw / 2, by0, bw * Math.max(0, m.hp / m.maxHp), 8);
        ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.strokeText('중간 보스', sx, by0 - 10);
        ctx.fillStyle = '#ffb09a';
        ctx.fillText('중간 보스', sx, by0 - 10);
      } else if (m.final) {
        const bw = 140, by0 = sy - m.r - 46;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(sx - bw / 2, by0, bw, 10);
        ctx.fillStyle = '#c45aff';
        ctx.fillRect(sx - bw / 2, by0, bw * Math.max(0, m.hp / m.maxHp), 10);
        ctx.font = 'bold 14px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        ctx.strokeText('최종 보스 · 끝판왕', sx, by0 - 11);
        ctx.fillStyle = '#ffd24a';
        ctx.fillText('최종 보스 · 끝판왕', sx, by0 - 11);
      } else if (m.hp < m.maxHp) {
        const bw = 30;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(sx - bw / 2, sy - m.r - 14, bw, 5);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(sx - bw / 2, sy - m.r - 14, bw * (m.hp / m.maxHp), 5);
      }
    }
    for (const p of poofs) {
      const k = p.t / 0.4;
      ctx.strokeStyle = `rgba(200,160,230,${1 - k})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x - cam.x, p.y - cam.y, 10 + k * 26, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawItems() {
    for (const it of items) {
      const sx = it.x - cam.x, sy = it.y - cam.y;
      if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
      const pop = Math.min(1, it.t / 0.2);
      const bob = Math.sin(it.t * 4) * 3;
      const r = it.r * pop;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + it.r * 0.9, r * 0.9, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      // 빛무리
      ctx.fillStyle = `rgba(255,120,70,${0.22 + 0.1 * Math.sin(it.t * 6)})`;
      ctx.beginPath();
      ctx.arc(sx, sy - 4 + bob, r * 1.9, 0, Math.PI * 2);
      ctx.fill();
      // 알맹이
      ctx.fillStyle = '#ff5a3c';
      ctx.strokeStyle = '#8a1f10';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy - 4 + bob, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(sx - r * 0.35, sy - 4 + bob - r * 0.35, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFloats() {
    ctx.font = 'bold 16px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const f of floats) {
      const k = f.t / 1.1;
      const sx = f.x - cam.x, sy = f.y - cam.y - k * 40;
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(0,0,0,${0.7 * (1 - k)})`;
      ctx.fillStyle = `rgba(${f.color || '255,214,90'},${1 - k})`;
      ctx.strokeText(f.text, sx, sy);
      ctx.fillText(f.text, sx, sy);
    }
  }

  function drawHud() {
    const text = '공격력 ' + fmtPower(playerDmg());
    const size = 17 + power.flash * 6;
    ctx.font = `bold ${size}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(text).width;
    const x = 12, y = safeTop + 12, h = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, y, tw + 24, h);
    ctx.fillStyle = power.flash > 0 ? '#ffd65a' : '#ffffff';
    ctx.fillText(text, x + 12, y + h / 2 + 1);

    // 체력
    const hy = y + h + 6, bw = 150, bh = 16;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, hy, bw + 24, bh + 10);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 12, hy + 5, bw, bh);
    ctx.fillStyle = player.hurt > 0 ? '#ffffff' : '#e74c3c';
    ctx.fillRect(x + 12, hy + 5, bw * (player.hp / player.maxHp), bh);
    ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('체력 ' + player.hp + ' / ' + player.maxHp, x + 12 + bw / 2, hy + 5 + bh / 2 + 1);

    // 무기
    const wy = hy + bh + 10 + 6;
    const w = curWeapon();
    const wtext = '무기 ' + w.name + (weapon.tier >= WEAPONS.length - 1 ? ' (최강)' : '');
    ctx.font = `bold ${14 + weapon.fx * 4}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'left';
    const ww = ctx.measureText(wtext).width;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, wy, ww + 24, 26);
    ctx.fillStyle = `rgb(${w.color})`;
    ctx.fillText(wtext, x + 12, wy + 14);
  }

  function drawBullets() {
    const lw = 4 + Math.min(power.level, 8);
    ctx.lineCap = 'round';
    for (const b of bullets) {
      const sx = b.x - cam.x, sy = b.y - cam.y;
      const tx = sx - b.vx * 0.015, ty = sy - b.vy * 0.015;
      if (b.glow) {
        // 빛나는 총알: 바깥 빛 + 하얀 심지
        ctx.strokeStyle = `rgba(${b.color},0.35)`;
        ctx.lineWidth = lw + 8;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = `rgb(${b.color})`;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = Math.max(1.5, lw * 0.35);
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
      } else {
        ctx.strokeStyle = `rgb(${b.color})`;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
      }
    }
    ctx.lineCap = 'butt';
  }

  function drawFireBtn() {
    const p = fireBtnPos();
    ctx.fillStyle = fireBtn.pressed ? 'rgba(255,90,70,0.55)' : 'rgba(255,90,70,0.3)';
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, fireBtn.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 조준경 모양
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);
    ctx.moveTo(p.x - 20, p.y); ctx.lineTo(p.x - 6, p.y);
    ctx.moveTo(p.x + 6, p.y); ctx.lineTo(p.x + 20, p.y);
    ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x, p.y - 6);
    ctx.moveTo(p.x, p.y + 6); ctx.lineTo(p.x, p.y + 20);
    ctx.stroke();
  }

  function drawStick() {
    if (!stick.active) return;
    let dx = stick.x - stick.ox;
    let dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > stick.max) { dx = dx / d * stick.max; dy = dy / d * stick.max; }

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(stick.ox, stick.oy, stick.max, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.arc(stick.ox + dx, stick.oy + dy, 22, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    drawWorld();
    drawItems();
    drawBossTelegraphs();
    drawHitboxes();
    drawMonsters();
    drawBullets();
    drawEnemyShots();
    drawPlayer();
    drawFloats();
    drawBanner();
    drawStick();
    drawFireBtn();
    drawHud();
    drawPick();
  }

  function drawPick() {
    if (!pick.open) return;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    const rs = pickCardRects();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.strokeText('강화 선택!', W / 2, rs[0].y - 44);
    ctx.fillStyle = '#ffd65a';
    ctx.fillText('강화 선택!', W / 2, rs[0].y - 44);
    ctx.font = '13px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('하나를 눌러서 고르세요 (키보드 1 · 2 · 3)', W / 2, rs[0].y - 18);
    const ready = pick.openT >= 0.35;
    for (let i = 0; i < 3; i++) {
      const r = rs[i], o = PICK_OPTIONS[i], on = pick.sel === i;
      ctx.globalAlpha = ready ? 1 : 0.6;
      ctx.fillStyle = on ? 'rgba(' + o.color + ',0.28)' : 'rgba(30,34,40,0.92)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = 'rgb(' + o.color + ')';
      ctx.lineWidth = on ? 4 : 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgb(' + o.color + ')';
      ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
      ctx.fillText(String(i + 1), r.x + 12, r.y + 16);
      ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
      ctx.fillText(o.title, r.x + 30, r.y + r.h / 2 - 11);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '13px system-ui, -apple-system, sans-serif';
      ctx.fillText(o.desc(), r.x + 30, r.y + r.h / 2 + 15);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
  }

  // ===== 루프 =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (pick.open) pick.openT += dt; else update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
